<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakemon</title>
<style>
  :root {
    --mat-green: #1d4d3a;
    --mat-green-light: #245a44;
    --card-cream: #fdf6e3;
    --card-border: #d9b25c;
    --accent: #d8e04a;
    --text-light: #cfe8db;
    --text-muted: #9fc7ae;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f2e22;
    color: #eee;
    min-height: 100vh;
  }
  button {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: var(--card-cream);
    color: #3a2f1a;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: #f5e3b3; }
  button.primary { background: var(--accent); border-color: #a8b32e; }
  button.primary:hover { background: #c7ce3f; }
  button.small { padding: 3px 8px; font-size: 12px; }

  #home-screen, #welcome-screen {
    max-width: 420px;
    margin: 100px auto;
    background: var(--mat-green);
    padding: 28px;
    border-radius: 12px;
    text-align: center;
  }
  #welcome-screen {
    max-width: 480px;
    text-align: left;
  }
  #welcome-screen h2 { text-align: center; margin-bottom: 24px; }
  #home-screen h2, #welcome-screen h2 { color: var(--accent); margin-top: 0; }
  #home-screen input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    font-size: 15px;
    margin: 12px 0;
    box-sizing: border-box;
  }
  #home-screen p { color: var(--text-light); font-size: 13px; }

  #pin-row { margin-top: 12px; }
  #pin-row input {
    width: 30%;
    min-width: 90px;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    font-size: 22px;
    letter-spacing: 8px;
    text-align: center;
    margin: 8px auto;
    box-sizing: border-box;
    display: block;
  }
  #pin-subtitle { color: var(--text-light); font-size: 13px; margin: 10px 0 0; }
  #pin-error { color: #e0997b; font-size: 13px; min-height: 16px; margin: 2px 0 4px; }

  .welcome-card {
    background: var(--mat-green-light);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 16px;
  }
  .welcome-card h3 {
    color: var(--accent);
    font-size: 14px;
    margin: 0 0 12px;
  }
  .welcome-card h3 a {
    color: inherit;
    text-decoration: none;
  }
  .welcome-card h3 a:hover { text-decoration: underline; }

  #news-list { display: flex; flex-direction: column; gap: 10px; }
  .news-item { font-size: 13px; color: var(--text-light); }
  .news-item .news-date {
    display: block;
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 2px;
  }
  #news-empty { color: var(--text-muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>

<div id="bakemon-shared-header-slot"></div>

<div id="home-screen">
  <h2>Who's playing?</h2>
  <input type="text" id="name-input" placeholder="Type your name...">
  <datalist id="known-players"></datalist>

  <div id="pin-row" style="display:none;">
    <p id="pin-subtitle"></p>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pin-input" placeholder="••••">
    <div id="pin-error"></div>
  </div>

  <button class="primary" id="login-btn">Continue</button>
  <p>New player? Enter your name to create a profile.</p>
</div>

<div id="welcome-screen" style="display:none;">
  <h2>Welcome back, <span id="welcome-name"></span>!</h2>

  <div class="welcome-card">
    <h3><a href="players.html">Top Players →</a></h3>
    <div id="leaderboard"></div>
  </div>

  <div class="welcome-card">
    <h3>What's New</h3>
    <div id="news-list"></div>
  </div>
</div>

<script src="shared-header.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ykfuhvkjknrhocmahelx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_eyQa19eT_dhAEKFxTLNX5Q_AqsL7HSl";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadKnownPlayers() {
  const { data, error } = await supabaseClient.from("players").select("display_name").order("display_name");
  if (error) return;
  const datalist = document.getElementById("known-players");
  datalist.innerHTML = "";
  data.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.display_name;
    datalist.appendChild(opt);
  });
}

const nameInput = document.getElementById("name-input");
const pinInput = document.getElementById("pin-input");
const pinRow = document.getElementById("pin-row");
const pinSubtitle = document.getElementById("pin-subtitle");
const pinError = document.getElementById("pin-error");
const loginBtn = document.getElementById("login-btn");

document.getElementById("login-btn").addEventListener("click", handleContinue);
pinInput.addEventListener("keydown", e => {
  if (e.key === "Enter") handleContinue();
});

// Resolve the name (and reveal the pin row) when the player leaves the
// name field or presses Enter in it — NOT on every keystroke, so we're
// not hammering the database while someone's still typing.
nameInput.addEventListener("blur", resolveName);
nameInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    resolveName();
  }
});

// If the name changes after the pin row is already showing (player edited
// it instead of starting over), collapse the pin row again — it belongs
// to whichever name was last resolved, not necessarily this one anymore.
nameInput.addEventListener("input", () => {
  if (pendingLogin && nameInput.value.trim().toLowerCase() !== pendingLogin.name.toLowerCase()) {
    hidePinRow();
  }
});

// Holds the resolved name we're currently showing a pin row for.
// { name, isNewPlayer, existingPlayer, hasPin }
let pendingLogin = null;

async function resolveName() {
  const name = nameInput.value.trim();
  if (!name) return;
  // Case-insensitive check, matching the database's ilike lookup below —
  // otherwise typing a name in different casing than pendingLogin.name
  // (which holds the database's stored capitalization once resolved)
  // would wrongly look like a "different" name and re-fetch unnecessarily.
  if (pendingLogin && pendingLogin.name.toLowerCase() === name.toLowerCase()) return;

  // Note: no "*" here — the pin column is deliberately unreadable via a
  // normal select (see verify_player_pin / player_has_pin for how the pin
  // itself gets checked). Listing columns explicitly is required for any
  // query against players.
  const { data: existing, error } = await supabaseClient
    .from("players")
    .select("id, display_name, created_at")
    .ilike("display_name", name)
    .maybeSingle();

  if (error) {
    console.error(error);
    alert("Something went wrong loading your profile. Try again?");
    return;
  }

  if (existing) {
    const { data: hasPin, error: hasPinErr } = await supabaseClient.rpc("player_has_pin", {
      p_display_name: existing.display_name
    });
    if (hasPinErr) {
      console.error(hasPinErr);
      alert("Something went wrong checking your profile. Try again?");
      return;
    }
    pendingLogin = { name: existing.display_name, isNewPlayer: false, existingPlayer: existing, hasPin };
    showPinRow(hasPin
      ? `Type your 4-digit PIN for <strong>${existing.display_name}</strong>.`
      : `Set a 4-digit PIN for <strong>${existing.display_name}</strong> so only you can log in as this player.`);
  } else {
    pendingLogin = { name, isNewPlayer: true, existingPlayer: null, hasPin: false };
    showPinRow(`Set a 4-digit PIN for <strong>${name}</strong> so only you can log in as this player.`);
  }
}

function showPinRow(subtitleHtml) {
  pinSubtitle.innerHTML = subtitleHtml;
  pinError.textContent = "";
  pinInput.value = "";
  pinRow.style.display = "block";
  pinInput.focus();
}

function hidePinRow() {
  pendingLogin = null;
  pinRow.style.display = "none";
  pinInput.value = "";
  pinError.textContent = "";
}

// The single Continue button: if the name hasn't been resolved into a pin
// prompt yet (e.g. player typed a name and clicked Continue without ever
// leaving the field), resolve it first, then fall through to the pin step
// once it's showing.
async function handleContinue() {
  if (!pendingLogin || pendingLogin.name.toLowerCase() !== nameInput.value.trim().toLowerCase()) {
    await resolveName();
    return; // let them see/fill the pin row; Continue again submits it
  }
  await submitPin();
}

async function submitPin() {
  const pin = pinInput.value.trim();

  if (!/^[0-9]{4}$/.test(pin)) {
    pinError.textContent = "PIN must be exactly 4 digits.";
    return;
  }

  if (pendingLogin.isNewPlayer) {
    const { data: created, error: createErr } = await supabaseClient
      .from("players")
      .insert({ display_name: pendingLogin.name, pin })
      .select("id, display_name, created_at")
      .single();
    if (createErr) {
      console.error(createErr);
      pinError.textContent = "Couldn't create a profile. Try again?";
      return;
    }
    finishLogin(created);
    return;
  }

  if (!pendingLogin.hasPin) {
    // First time setting a pin for an existing account.
    // Update policy only allows this while pin is currently null, matching
    // this exact situation — see "players can set their own pin once".
    const { error: updateErr } = await supabaseClient
      .from("players")
      .update({ pin })
      .ilike("display_name", pendingLogin.name);
    if (updateErr) {
      console.error(updateErr);
      pinError.textContent = "Couldn't save your PIN. Try again?";
      return;
    }
    finishLogin(pendingLogin.existingPlayer);
    return;
  }

  // Verifying an existing pin.
  const { data: correct, error: verifyErr } = await supabaseClient.rpc("verify_player_pin", {
    p_display_name: pendingLogin.name,
    p_guess: pin
  });
  if (verifyErr) {
    console.error(verifyErr);
    pinError.textContent = "Something went wrong. Try again?";
    return;
  }
  if (!correct) {
    pinError.textContent = "That PIN doesn't match. Try again.";
    pinInput.value = "";
    pinInput.focus();
    return;
  }

  finishLogin(pendingLogin.existingPlayer);
}

function finishLogin(player) {
  pendingLogin = null;
  window.setBakemonPlayer(player);
  showWelcome(player);
}

function showWelcome(player) {
  document.getElementById("home-screen").style.display = "none";
  document.getElementById("welcome-screen").style.display = "block";
  document.getElementById("welcome-name").textContent = player.display_name;
  loadLeaderboard();
  loadNews();
}

async function loadLeaderboard() {
  const el = document.getElementById("leaderboard");
  const { data: matches, error } = await supabaseClient
    .from("match_history")
    .select("player_1_id, player_2_id, winner_id")
    .not("winner_id", "is", null); // only decided matches count toward win rate

  if (error || !matches || matches.length === 0) {
    el.innerHTML = `<div id="news-empty">No matches played yet.</div>`;
    return;
  }

  // Tally wins and total decided matches per player
  const tally = {}; // player_id -> { wins, total }
  matches.forEach(m => {
    [m.player_1_id, m.player_2_id].forEach(pid => {
      if (!pid) return;
      if (!tally[pid]) tally[pid] = { wins: 0, total: 0 };
      tally[pid].total += 1;
    });
    if (m.winner_id && tally[m.winner_id]) tally[m.winner_id].wins += 1;
  });

  const ranked = Object.entries(tally)
    .map(([playerId, stats]) => ({ playerId, ...stats, rate: stats.wins / stats.total }))
    .filter(r => r.total >= 1)
    .sort((a, b) => b.rate - a.rate || b.total - a.total)
    .slice(0, 3);

  if (ranked.length === 0) {
    el.innerHTML = `<div id="news-empty">No matches played yet.</div>`;
    return;
  }

  const { data: players } = await supabaseClient.from("players").select("id, display_name").in("id", ranked.map(r => r.playerId));
  const nameById = Object.fromEntries((players || []).map(p => [p.id, p.display_name]));

  const medals = ["🥇", "🥈", "🥉"];
  el.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:6px;">
      ${ranked.map((r, i) => `
        <div style="display:flex; justify-content:space-between; background:rgba(255,255,255,0.05); border-radius:6px; padding:6px 12px; font-size:13px;">
          <span>${medals[i]} ${escapeHtml(nameById[r.playerId] || "Unknown")}</span>
          <span style="color:var(--text-muted);">${Math.round(r.rate * 100)}% (${r.wins}/${r.total})</span>
        </div>
      `).join("")}
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function formatUpdateDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

async function loadNews() {
  const el = document.getElementById("news-list");
  const { data: updates, error } = await supabaseClient
    .from("site_updates")
    .select("id, message, created_at")
    .order("created_at", { ascending: false })
    .limit(5);

  if (error) {
    console.error("Failed to load site updates:", error);
    el.innerHTML = `<div id="news-empty">Couldn't load updates.</div>`;
    return;
  }

  if (!updates || updates.length === 0) {
    el.innerHTML = `<div id="news-empty">No updates yet — check back soon!</div>`;
    return;
  }

  el.innerHTML = updates.map(u => `
    <div class="news-item">
      ${escapeHtml(u.message)}
      <span class="news-date">${formatUpdateDate(u.created_at)}</span>
    </div>
  `).join("");
}

const existingPlayer = window.getBakemonPlayer();
if (existingPlayer) {
  showWelcome(existingPlayer);
} else {
  loadKnownPlayers();
}
</script>

</body>
</html>
