<!-- Bakemon shared header: logo, nav, identity block, and the rules drawer shell.
     Loaded into playmat.html, deckbuilder.html and index.html via shared-header.js.
     Edit this file for nav, identity, or the drawer mechanism itself.
     Edit rules.html instead to change what's actually inside the Rules drawer. -->

<style>
  .bakemon-header {
    background: var(--mat-green, #1d4d3a);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 2px solid var(--card-border, #d9b25c);
    box-shadow: var(--panel-shadow, none);
    position: relative;
    z-index: 10;
  }
  .bakemon-logo {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent, #d8e04a);
    text-decoration: none;
    white-space: nowrap;
  }
  .bakemon-nav {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .bakemon-nav a {
    color: var(--accent, #d8e04a);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    text-transform: var(--nav-text-transform, none);
    letter-spacing: var(--nav-letter-spacing, normal);
  }
  .bakemon-nav a:hover { font-weight: 800; }
  .bakemon-nav a.current { font-weight: 800; }

  .bakemon-nav-item { position: relative; }
  .bakemon-nav-trigger {
    all: unset;
    cursor: pointer;
    color: var(--accent, #d8e04a);
    font-size: 14px;
    font-weight: 600;
    text-transform: var(--nav-text-transform, none);
    letter-spacing: var(--nav-letter-spacing, normal);
  }
  .bakemon-nav-trigger:hover { font-weight: 800; }
  .bakemon-nav-item.current > .bakemon-nav-trigger { font-weight: 800; }

  .bakemon-dropdown {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--mat-green, #1d4d3a);
    border: 1px solid var(--card-border, #d9b25c);
    border-radius: 8px;
    padding: 6px;
    margin-top: 4px;
    min-width: 170px;
    
    z-index: 140;
  }
  /* Hover, click (for touch — see wireNavDropdowns), and keyboard focus all open it. */
  .bakemon-nav-item.has-dropdown.open .bakemon-dropdown,
  .bakemon-nav-item.has-dropdown:focus-within .bakemon-dropdown {
    display: flex;
  }
  .bakemon-dropdown a {
    display: block;
    padding: 7px 10px;
    border-radius: 6px;
    color: var(--text-light, #cfe8db);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    text-transform: var(--nav-text-transform, none);
    letter-spacing: var(--nav-letter-spacing, normal);
  }
  .bakemon-dropdown a.current { color: var(--accent-2, var(--accent, #d8e04a)); }
  .bakemon-dropdown a:hover { background: rgba(255,255,255,0.08); }
  .bakemon-header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .bakemon-identity {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-light, #cfe8db);
    white-space: nowrap;
  }
  .bakemon-identity a { color: inherit; }
  .bakemon-identity a strong { color: var(--accent-2, var(--accent, #d8e04a)); }
  .bakemon-identity button.small { padding: 4px 10px; }

  /* One small swatch showing the CURRENT theme, doubling as the dropdown's
     trigger — reuses the same has-dropdown/.bakemon-dropdown mechanism as
     the Cards/Battle nav menus (hover, tap-to-toggle, focus-within, outside
     click and Escape to close) instead of its own bespoke behavior. */
  .bakemon-theme-trigger {
    all: unset;
    cursor: pointer;
    display: block;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35), 0 0 0 2px var(--card-border, #d9b25c);
  }
  .bakemon-theme-trigger:hover { transform: scale(1.1); }
  .bakemon-theme-swatch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
  }
  .bakemon-theme-trigger.felt, .bakemon-theme-swatch.felt { background: linear-gradient(135deg, #163d29 50%, #d9c65a 50%); }
  .bakemon-theme-trigger.parchment, .bakemon-theme-swatch.parchment { background: linear-gradient(135deg, #fbf4df 50%, #916a22 50%); }
  .bakemon-theme-trigger.arcade, .bakemon-theme-swatch.arcade { background: linear-gradient(135deg, #171a42 50%, #52e0ff 50%); }

  /* This dropdown sits at the far-right edge of the header, so it opens
     leftward instead of the default left-anchored Cards/Battle style —
     anchoring it left here would run it off the edge of the screen. */
  .bakemon-dropdown.align-right { left: auto; right: 0; }
  .bakemon-theme-option {
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 6px;
    color: var(--text-light, #cfe8db);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    box-sizing: border-box;
    width: 100%;
  }
  .bakemon-theme-option:hover { background: rgba(255,255,255,0.08); }
  .bakemon-theme-option.current { color: var(--accent-2, var(--accent, #d8e04a)); }

  /* Match challenge count — hidden entirely (see updateChallengeBadge() in
     shared-header.js) until there's actually one needing a decision. Sits
     right in the "Playing as [name]" identity link, which goes to your own
     profile — that's where the "View Challenges" button lives that opens
     the drawer below. */
  .bakemon-identity-badge {
    display: none;
    margin-left: 4px;
    background: #c0392b;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    border-radius: 999px;
    padding: 2px 6px;
    vertical-align: middle;
  }

  /* Challenges drawer — same shell mechanism as the Rules drawer (see
     #rules-drawer below): slides in from the left, backdrop click or
     Escape closes it. Opened via window.openChallengesDrawer(), exposed
     by shared-header.js so any page (currently just player.html's own
     profile) can trigger it without owning the drawer itself. */
  #challenges-drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(420px, 90vw);
    background: var(--mat-green, #1d4d3a);
    border-right: 2px solid var(--card-border, #d9b25c);
    z-index: 151;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    overflow-y: auto;
    padding: 16px;
    box-sizing: border-box;
  }
  #challenges-drawer.open { transform: translateX(0); }

  .challenges-drawer-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .challenges-drawer-head h2 { color: var(--accent, #d8e04a); font-size: 18px; margin: 0; }

  .challenges-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .challenges-tab {
    all: unset;
    cursor: pointer;
    flex: 1;
    text-align: center;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light, #cfe8db);
    background: rgba(255,255,255,0.05);
  }
  .challenges-tab.current { background: var(--accent, #d8e04a); color: var(--button-text, #2a2a10); }
  .challenges-tab-panel { display: none; flex-direction: column; gap: 8px; }
  .challenges-tab-panel.current { display: flex; }

  .challenge-drawer-empty {
    color: var(--text-muted, #9fc7ae);
    font-size: 13px;
    font-style: italic;
    padding: 12px 4px;
  }

  .challenge-drawer-item {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 28px 10px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-border, #d9b25c);
  }
  .challenge-drawer-item .who { color: var(--accent, #d8e04a); font-weight: 700; font-size: 13px; }
  .challenge-drawer-item .msg { color: var(--text-light, #cfe8db); font-size: 12px; font-style: italic; }
  .challenge-drawer-item .code { color: var(--text-light, #cfe8db); font-size: 12px; }
  .challenge-drawer-item .response-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 999px;
    width: fit-content;
  }
  .challenge-drawer-item .response-tag.accepted { background: var(--success-bg, #4a9a5c); color: var(--success-text, #fff); }
  .challenge-drawer-item .response-tag.rejected { background: #8a4040; color: #fff; }
  .challenge-drawer-item .response-tag.pending { background: rgba(255,255,255,0.12); color: var(--text-muted, #9fc7ae); }
  .challenge-drawer-actions { display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
  .challenge-drawer-item .hide-btn {
    all: unset;
    cursor: pointer;
    position: absolute;
    top: 6px;
    right: 8px;
    color: var(--text-muted, #9fc7ae);
    font-size: 14px;
    line-height: 1;
    padding: 2px;
  }
  .challenge-drawer-item .hide-btn:hover { color: var(--text-light, #cfe8db); }

  #rules-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
  }
  #rules-backdrop.open { display: block; }

  #rules-drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(360px, 85vw);
    background: var(--mat-green, #1d4d3a);
    border-right: 2px solid var(--card-border, #d9b25c);
    z-index: 151;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    overflow-y: auto;
    padding: 16px;
    box-sizing: border-box;
  }
  #rules-drawer.open { transform: translateX(0); }

  .rules-drawer-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .rules-drawer-head h2 { color: var(--accent, #d8e04a); font-size: 18px; margin: 0; }

  .rules-sections { display: flex; flex-direction: column; gap: 8px; }
  .rules-section {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border, #d9b25c);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .rules-inner {
    background: rgba(255,255,255,0.04);
    border: 1px hidden var(--card-border, #d9b25c);
    border-radius: 8px;
    padding: 8px 12px;
    font-weight: 400;
    font-size: 12px;   
  }

     
  .rules-section summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--text-light, #cfe8db);
    font-size: 14px;
  }
  .rules-placeholder {
    color: var(--text-muted, #9fc7ae);
    font-size: 13px;
    font-style: italic;
    margin: 8px 0 2px;
  }
</style>

<header class="bakemon-header">
  <a href="index.html" class="bakemon-logo">⚔️ Bakemon</a>
  <nav class="bakemon-nav" id="bakemon-shared-nav">
    <div class="bakemon-nav-item has-dropdown" id="nav-group-cards">
      <button type="button" class="bakemon-nav-trigger" id="nav-link-cards">Cards</button>
      <div class="bakemon-dropdown">
        <a href="deckbuilder.html?tab=collection" id="nav-link-collection">Collection</a>
        <a href="deckbuilder.html?tab=deck" id="nav-link-deckbuilder">Deckbuilder</a>
      </div>
    </div>
    <div class="bakemon-nav-item has-dropdown" id="nav-group-battle">
      <button type="button" class="bakemon-nav-trigger" id="nav-link-battle">Battle</button>
      <div class="bakemon-dropdown">
        <a href="playmat.html" id="nav-link-playmat">Start Battle</a>
        <a href="practice.html" id="nav-link-practice">Practice vs Bot</a>
        <a href="matches.html" id="nav-link-matchhistory">Recent Matches</a>
        <a href="tournaments.html" id="nav-link-tournaments">Tournaments</a>
      </div>
    </div>
    <a href="players.html" id="nav-link-directory">Directory</a>   
    <a href="#" id="rules-toggle-btn">Rules</a>
  </nav>
  <div class="bakemon-header-right">
    <div class="bakemon-identity" id="bakemon-identity-slot"></div>
    <div class="bakemon-nav-item has-dropdown" id="bakemon-theme-switch">
      <button type="button" class="bakemon-theme-trigger" id="bakemon-theme-trigger" aria-label="Change color theme"></button>
      <div class="bakemon-dropdown align-right">
        <button type="button" class="bakemon-theme-option" data-theme="felt"><span class="bakemon-theme-swatch felt"></span>Underlit Felt</button>
        <button type="button" class="bakemon-theme-option" data-theme="parchment"><span class="bakemon-theme-swatch parchment"></span>Parchment &amp; Brass</button>
        <button type="button" class="bakemon-theme-option" data-theme="arcade"><span class="bakemon-theme-swatch arcade"></span>Night Arcade</button>
      </div>
    </div>
  </div>
</header>

<div id="rules-backdrop"></div>
<aside id="rules-drawer">
  <div class="rules-drawer-head">
    <h2>Rules Reference</h2>
    <button id="rules-close-btn" class="small">✕</button>
  </div>
  <div id="rules-content-slot"></div>
</aside>

<div id="challenges-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:150;"></div>
<aside id="challenges-drawer">
  <div class="challenges-drawer-head">
    <h2>Challenges</h2>
    <button id="challenges-close-btn" class="small">✕</button>
  </div>
  <div class="challenges-tabs">
    <button type="button" class="challenges-tab current" id="challenges-tab-received" data-tab="received">Received</button>
    <button type="button" class="challenges-tab" id="challenges-tab-sent" data-tab="sent">Sent</button>
  </div>
  <div class="challenges-tab-panel current" id="challenges-panel-received"></div>
  <div class="challenges-tab-panel" id="challenges-panel-sent"></div>
</aside>
