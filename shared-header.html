<!-- Bakemon shared header: logo, nav, identity block, and the rules drawer shell.
     Loaded into playmat.html, deckbuilder.html and index.html via shared-header.js.
     Edit this file for nav, identity, or the drawer mechanism itself.
     Edit rules.html instead to change what's actually inside the Rules drawer. -->

<style>
  .bakemon-header {
    background: var(--mat-green, #1d4d3a);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 2px solid var(--card-border, #d9b25c);
  }
  .bakemon-logo {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent, #d8e04a);
    text-decoration: none;
    white-space: nowrap;
  }
  .bakemon-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .bakemon-nav a {
    color: var(--accent, #d8e04a);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .bakemon-nav a:hover { text-decoration: underline; }
  .bakemon-nav a.current { text-decoration: underline; }
  .bakemon-nav .bakemon-nav-sep { color: var(--text-muted, #9fc7ae); font-size: 13px; }

  .bakemon-identity {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-light, #cfe8db);
    white-space: nowrap;
  }
  .bakemon-identity button.small { padding: 4px 10px; }

  #rules-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
  }
  #rules-backdrop.open { display: block; }

  #rules-drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(360px, 85vw);
    background: var(--mat-green, #1d4d3a);
    border-right: 2px solid var(--card-border, #d9b25c);
    z-index: 151;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    overflow-y: auto;
    padding: 16px;
    box-sizing: border-box;
  }
  #rules-drawer.open { transform: translateX(0); }

  .rules-drawer-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .rules-drawer-head h2 { color: var(--accent, #d8e04a); font-size: 18px; margin: 0; }

  .rules-sections { display: flex; flex-direction: column; gap: 8px; }
  .rules-section {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border, #d9b25c);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .rules-section summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--text-light, #cfe8db);
    font-size: 14px;
  }
  .rules-placeholder {
    color: var(--text-muted, #9fc7ae);
    font-size: 13px;
    font-style: italic;
    margin: 8px 0 2px;
  }
</style>

<header class="bakemon-header">
  <a href="index.html" class="bakemon-logo">⚔️ Bakemon</a>
  <nav class="bakemon-nav" id="bakemon-shared-nav">
    <a href="deckbuilder.html?tab=collection" id="nav-link-collection">My Collection</a>
    <span class="bakemon-nav-sep">|</span>
    <a href="deckbuilder.html?tab=deck" id="nav-link-deckbuilder">Deckbuilder</a>
    <span class="bakemon-nav-sep">|</span>
    <a href="#" id="rules-toggle-btn">Rules</a>
    <span class="bakemon-nav-sep">|</span>
    <a href="playmat.html" id="nav-link-playmat">Battle</a>
    <span class="bakemon-nav-sep">|</span>
    <a href="player.html" id="nav-link-profile">Profile</a>
    <span class="bakemon-nav-sep">|</span>
    <a href="players.html" id="nav-link-profile">Directory</a>
    <span class="bakemon-nav-sep">|</span>
    <a href="matches.html" id="nav-link-profile">Recent Matches</a>   
       
  </nav>
  <div class="bakemon-identity" id="bakemon-identity-slot"></div>
</header>

<div id="rules-backdrop"></div>
<aside id="rules-drawer">
  <div class="rules-drawer-head">
    <h2>Rules Reference</h2>
    <button id="rules-close-btn" class="small">✕</button>
  </div>
  <div id="rules-content-slot"></div>
</aside>
