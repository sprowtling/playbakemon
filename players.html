<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakemon Player Directory</title>
<style>
  :root {
    --mat-green: #1d4d3a;
    --card-cream: #fdf6e3;
    --card-border: #d9b25c;
    --accent: #d8e04a;
    --text-light: #cfe8db;
    --text-muted: #9fc7ae;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f2e22;
    color: #eee;
    min-height: 100vh;
  }
  button {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: var(--card-cream);
    color: #3a2f1a;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: #f5e3b3; }
  button.sort-toggle.active { background: var(--accent); border-color: #a8b32e; }

  #content { max-width: 700px; margin: 24px auto; padding: 0 16px; }

  h2 {
    color: var(--accent);
    text-align: center;
    margin-bottom: 4px;
  }
  #subheading {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 20px;
  }

  #sort-controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .section-label {
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 18px 0 8px;
  }

  #player-list { display: flex; flex-direction: column; gap: 8px; }
  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #164634;
    border-radius: 8px;
    padding: 10px 14px;
    border-left: 4px solid var(--text-muted);
    gap: 10px;
    flex-wrap: wrap;
    text-decoration: none;
    color: inherit;
  }
  .player-row:hover { background: #1a5540; }
  .player-row.ranked { border-left-color: var(--accent); }

  .player-rank {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-muted);
    width: 26px;
    text-align: center;
    flex-shrink: 0;
  }
  .player-row.ranked .player-rank { color: var(--accent); }

  .player-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .player-name { font-size: 14px; font-weight: 600; color: var(--text-light); }
  .player-meta { font-size: 11px; color: var(--text-muted); }

  .player-winrate {
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    background: #2a6b4f;
    color: #b8f0d0;
    white-space: nowrap;
  }
  .player-winrate.no-rate { background: #3a3a3a; color: var(--text-muted); }

  #empty-message {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="bakemon-shared-header-slot"></div>

<div id="content">
  <h2>Player Directory</h2>
  <div id="subheading"></div>
  <div style="text-align:center; margin-bottom:16px;">
    <a href="matches.html" style="color:var(--text-light); font-size:13px;">See recent matches →</a>
  </div>

  <div id="sort-controls">
    <button class="sort-toggle" id="sort-name-btn">Alphabetical</button>
    <button class="sort-toggle" id="sort-winrate-btn">Win Rate</button>
  </div>

  <div id="ranked-label" class="section-label" style="display:none;">Ranked (5+ matches)</div>
  <div id="ranked-list" class="player-list"></div>

  <div id="unranked-label" class="section-label" style="display:none;">Fewer Than 5 Matches</div>
  <div id="unranked-list" class="player-list"></div>

  <div id="all-list" class="player-list"></div>

  <div id="empty-message" style="display:none;">No players registered yet.</div>
</div>

<script src="shared-header.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ykfuhvkjknrhocmahelx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_eyQa19eT_dhAEKFxTLNX5Q_AqsL7HSl";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const RANKED_MIN_MATCHES = 5;

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

let allPlayers = []; // [{ id, display_name, wins, total, rate }]
let currentSort = "name"; // "name" | "winrate"

async function init() {
  const [{ data: players, error: playersErr }, { data: matches, error: matchesErr }] = await Promise.all([
    supabaseClient.from("players").select("id, display_name").order("display_name"),
    supabaseClient.from("match_history").select("player_1_id, player_2_id, winner_id")
  ]);

  if (playersErr) {
    console.error(playersErr);
    document.getElementById("empty-message").textContent = "Couldn't load the player directory — try refreshing.";
    document.getElementById("empty-message").style.display = "block";
    return;
  }

  if (!players || players.length === 0) {
    document.getElementById("empty-message").style.display = "block";
    return;
  }

  // Tally decided-match wins/totals per player, same logic as index.html's leaderboard
  const tally = {}; // player_id -> { wins, total }
  (matches || []).forEach(m => {
    [m.player_1_id, m.player_2_id].forEach(pid => {
      if (!pid) return;
      if (!tally[pid]) tally[pid] = { wins: 0, total: 0 };
    });
    // Only count decided matches toward win rate, same as history.html/index.html
    if (m.winner_id === null) return;
    [m.player_1_id, m.player_2_id].forEach(pid => {
      if (!pid) return;
      tally[pid].total += 1;
    });
    if (tally[m.winner_id]) tally[m.winner_id].wins += 1;
  });

  allPlayers = players.map(p => {
    const stats = tally[p.id] || { wins: 0, total: 0 };
    return {
      id: p.id,
      display_name: p.display_name,
      wins: stats.wins,
      total: stats.total,
      rate: stats.total ? stats.wins / stats.total : 0
    };
  });

  document.getElementById("subheading").textContent = `${allPlayers.length} registered player${allPlayers.length === 1 ? '' : 's'}`;

  render();
}

function render() {
  if (currentSort === "name") {
    renderAlphabetical();
  } else {
    renderByWinRate();
  }
  document.getElementById("sort-name-btn").classList.toggle("active", currentSort === "name");
  document.getElementById("sort-winrate-btn").classList.toggle("active", currentSort === "winrate");
}

function renderAlphabetical() {
  document.getElementById("ranked-label").style.display = "none";
  document.getElementById("ranked-list").innerHTML = "";
  document.getElementById("unranked-label").style.display = "none";
  document.getElementById("unranked-list").innerHTML = "";

  const sorted = [...allPlayers].sort((a, b) => a.display_name.localeCompare(b.display_name));
  document.getElementById("all-list").innerHTML = sorted.map(p => playerRowHtml(p)).join("");
}

function renderByWinRate() {
  document.getElementById("all-list").innerHTML = "";

  const ranked = allPlayers
    .filter(p => p.total >= RANKED_MIN_MATCHES)
    .sort((a, b) => b.rate - a.rate || b.total - a.total);
  const unranked = allPlayers
    .filter(p => p.total < RANKED_MIN_MATCHES)
    .sort((a, b) => a.display_name.localeCompare(b.display_name));

  const rankedLabel = document.getElementById("ranked-label");
  const unrankedLabel = document.getElementById("unranked-label");

  rankedLabel.style.display = ranked.length ? "block" : "none";
  unrankedLabel.style.display = unranked.length ? "block" : "none";

  document.getElementById("ranked-list").innerHTML = ranked
    .map((p, i) => playerRowHtml(p, i + 1, true))
    .join("");
  document.getElementById("unranked-list").innerHTML = unranked
    .map(p => playerRowHtml(p))
    .join("");
}

function playerRowHtml(p, rank, ranked) {
  const winRateLabel = p.total > 0 ? `${Math.round(p.rate * 100)}%` : "—";
  const metaLabel = p.total > 0
    ? `${p.wins}W · ${p.total} match${p.total === 1 ? '' : 'es'}`
    : "No matches yet";

  return `
    <a class="player-row${ranked ? ' ranked' : ''}" href="player.html?id=${p.id}">
      ${rank ? `<div class="player-rank">#${rank}</div>` : ''}
      <div class="player-info">
        <div class="player-name">${escapeHtml(p.display_name)}</div>
        <div class="player-meta">${metaLabel}</div>
      </div>
      <div class="player-winrate${p.total === 0 ? ' no-rate' : ''}">${winRateLabel}</div>
    </a>
  `;
}

document.getElementById("sort-name-btn").addEventListener("click", () => {
  currentSort = "name";
  render();
});
document.getElementById("sort-winrate-btn").addEventListener("click", () => {
  currentSort = "winrate";
  render();
});

init();
</script>

</body>
</html>
