<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakemon Battle Mat</title>
<style>
  :root {
    --mat-green: #1d4d3a;
    --mat-green-light: #245a44;
    --card-cream: #fdf6e3;
    --card-border: #d9b25c;
    --accent: #d8e04a;
    --text-light: #cfe8db;
    --text-muted: #9fc7ae;
    --panel-brown: #b98a5f;
  }
  * { box-sizing: border-box; }
  #mat-screen { zoom: 1.25; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f2e22;
    color: #eee;
    min-height: 100vh;
  }
  button {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: var(--card-cream);
    color: #3a2f1a;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: #f5e3b3; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: #a8b32e; }
  button.small { padding: 3px 8px; font-size: 12px; }
  input, select {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: var(--card-cream);
    font-size: 14px;
  }

  /* ---- Setup screen ---- */
  #setup-screen {
    max-width: 460px;
    margin: 60px auto;
    background: var(--mat-green);
    padding: 28px;
    border-radius: 12px;
    text-align: center;
  }
  #setup-screen h2 { color: var(--accent); margin-top: 0; }
  #setup-screen .field { margin: 14px 0; text-align: left; }
  #setup-screen label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 4px; }
  #setup-screen input, #setup-screen select { width: 100%; }
  #setup-screen .divider { margin: 20px 0; color: var(--text-muted); font-size: 12px; }
  #setup-status { font-size: 13px; color: var(--text-muted); min-height: 18px; margin-top: 10px; }

  /* ---- Battle mat ---- */
  #mat-screen { display: none; padding: 12px; max-width: 900px; margin: 0 auto; }
  .mat {
    display: flex;
    gap: 12px;
  }
  .field-col { flex: 1; }
  .chat-col {
    width: 200px;
    background: #164634;
    border-radius: 10px;
    border: 0.5px solid var(--card-border);
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hand-strip {
    margin-top: 12px;
    background: #164634;
    border-radius: 10px;
    border: 0.5px solid var(--card-border);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hand-strip h3 { font-size: 12px; margin: 0; color: var(--accent); }
  .chat-col h3 { font-size: 12px; margin: 0; color: var(--accent); text-align: center; }
  .chat-messages {
    flex: 1;
    min-height: 200px;
    max-height: 60vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 4px;
    font-size: 11px;
  }
  .chat-message { color: var(--text-light); line-height: 1.3; word-wrap: break-word; }
  .chat-message .sender { color: var(--accent); font-weight: 600; }
  .chat-message.own .sender { color: #b8dfc6; }
  .chat-input-row { display: flex; gap: 4px; }
  .chat-input-row input {
    flex: 1;
    padding: 6px 8px;
    font-size: 12px;
    min-width: 0;
  }
  .chat-input-row button { padding: 6px 10px; font-size: 12px; }
  .hand-list {
    display: flex;
    flex-direction: row;
    gap: 8px;
    max-width: 100%;
    overflow-x: auto;
    align-items: center;
    padding: 4px 2px;
  }
  .field {
    background: var(--mat-green);
    border-radius: 12px;
    padding: 14px;
    border: 0.5px solid var(--card-border);
  }
  .row-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 8px;
  }
  .bench-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
  }
  .bench-slot { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .active-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
  .divider-line { height: 1px; background: rgba(255,255,255,0.15); margin: 10px 0; }

  .card-face {
    width: 64px;
    height: 90px;
    border-radius: 6px;
    background: var(--card-cream);
    border: 1.5px solid var(--card-border);
    position: relative;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    color: #3a2f1a;
  }
  .card-face.empty {
    background: rgba(255,255,255,0.03);
    border: 1.5px dashed #6fae8d;
    cursor: pointer;
  }
  .card-face.face-down {
    background-image: url('https://hxa.neocities.org/bakemon/cardback.png');
    background-size: cover;
    background-position: center;
    border: 1.5px solid var(--card-border);
    cursor: default;
  }
  .card-face.active-size { width: 139px; height: 195px; }
  .card-face.item-slot {
    width: 84px;
    height: 118px;
    border-style: dashed;
  }
  .card-face.item-slot.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    color: #9fc7ae;
  }
  .card-face.item-slot.empty .label {
    position: static;
    background: none;
  }
  .card-face img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-face .label {
    position: relative;
    z-index: 1;
    background: rgba(253,246,227,0.92);
    font-size: 9px;
    padding: 2px 3px;
    line-height: 1.15;
    text-align: center;
  }
  .card-face.selected { outline: 3px solid var(--accent); outline-offset: 1px; }
  .card-face.hand-card { width: 80px; height: 112px; flex-shrink: 0; }
  .zoom-btn {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    padding: 0;
    line-height: 1;
    font-size: 10px;
    border-radius: 50%;
    z-index: 3;
    background: rgba(253,246,227,0.9);
    border: 1px solid var(--card-border);
    cursor: zoom-in;
  }
  .card-face.active-size .zoom-btn { width: 26px; height: 26px; font-size: 15px; }
  .card-face.active-size .label { font-size: 12px; padding: 3px 4px; }

  #lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  #lightbox-overlay img {
    max-width: 80vw;
    max-height: 80vh;
    border-radius: 12px;
    border: 3px solid var(--card-border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .status-badges {
    position: absolute;
    top: 2px;
    left: 2px;
    display: flex;
    gap: 2px;
    z-index: 2;
  }
  .status-badge {
    font-size: 9px;
    padding: 1px 3px;
    border-radius: 4px;
    background: #7a2e2e;
    color: #fff;
  }

  .side-panel {
    width: 82px;
    border-radius: 6px;
    border: 1px solid var(--panel-brown);
    background: rgba(255,255,255,0.04);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: center;
    font-size: 10px;
    color: #e0c9a8;
  }
  .side-panel .row { display: flex; align-items: center; gap: 4px; }
  .side-panel .dmg-controls { display: flex; align-items: center; gap: 4px; }
  .side-panel .dmg-controls button { padding: 1px 6px; font-size: 11px; }
  .side-panel .remaining { font-size: 12px; font-weight: 600; color: #fdf6e3; }
  .energy-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 60px; }
  .energy-dot {
    width: 11px; height: 11px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 7px; color: #222; cursor: pointer; border: 1px solid rgba(0,0,0,0.2);
  }

  .score-row {
    display: flex;
    align-items: center;
    justify-content: left;
    gap: 8px;
    margin: 4px 0;
  }
  .score-label { font-size: 11px; color: var(--text-muted); }
  .score-orbs { display: flex; gap: 5px; }
  .score-orb {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: transparent;
    cursor: pointer;
  }
  .score-orb.filled { background: var(--accent); }
  .score-orbs[data-view-only] .score-orb { cursor: default; }

  .bench-tray {
    width: 56px;
    height: 15px;
    border-radius: 4px;
    border: 1px solid var(--panel-brown);
    background: rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
  }
  .bench-tray .energy-dot { width: 9px; height: 9px; }

  #action-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 10px 0;
    flex-wrap: wrap;
  }
  #zone-counts {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  #selection-hint {
    text-align: center;
    font-size: 12px;
    color: var(--accent);
    min-height: 16px;
    margin: 4px 0;
  }
  #energy-picker {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--mat-green);
    border-top: 2px solid var(--card-border);
    padding: 12px;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    z-index: 50;
  }
  #status-picker {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--mat-green);
    border-top: 2px solid var(--card-border);
    padding: 12px;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    z-index: 50;
  }
  #end-match-picker {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--mat-green);
    border-top: 2px solid var(--card-border);
    padding: 16px;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 60;
  }
  #end-match-picker h3 { margin: 0; color: var(--accent); font-size: 15px; }
  #end-match-picker .options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

<div id="bakemon-shared-header-slot" data-requires-login="true"></div>

<div id="setup-screen">
  <h2>Enter the Battle</h2>
  <div class="field">
    <label>Deck to bring</label>
    <select id="deck-select-setup"><option>Loading your decks...</option></select>
  </div>
  <div class="divider">— then —</div>
  <div class="field">
    <label>Room code (share this with your opponent)</label>
    <input type="text" id="room-code-input" placeholder="e.g. blorp">
  </div>
  <button class="primary" id="join-btn">Create / Join Table</button>
  <div id="setup-status"></div>
</div>

<div id="mat-screen">
  <div id="start-match-banner" style="display:none; text-align:center; margin-bottom:8px;">
    <button id="start-match-btn" class="primary">Start Match — reveal both fields</button>
    <p style="font-size:11px; color:var(--text-muted); margin:4px 0 0;">While setting up, you can only see your own active/bench Bakemon. Click when both players are ready.</p>
  </div>
  <div id="selection-hint"></div>
  <div class="mat">
    <div class="field-col">
      <div class="field">
        <div class="row-label"><span id="opp-name-label">Opponent</span><span id="opp-zone-counts"></span></div>
        <div class="opp-zone-row" style="display:flex; align-items:center; justify-content:center; gap:28px; margin-bottom:10px; flex-wrap:wrap;">
          <div class="card-face" id="opp-discard-pile" data-view-only="1" style="border-style:dashed; flex-shrink:0;">
            <div class="label">Discard</div>
          </div>
          <div style="width:1px; align-self:stretch; background:rgba(255,255,255,0.15);"></div>
          <div class="bench-row" id="opp-bench" style="margin:0;"></div>
        </div>
        <div class="active-row" id="opp-active-row"></div>
        <div class="score-row" id="opp-score-row">
          <span class="score-label">Points</span>
          <div class="score-orbs" id="opp-score-orbs" data-view-only="1"></div>
        </div>
        <div class="divider-line"></div>
        <div class="score-row" id="my-score-row">
          <span class="score-label">Points</span>
          <div class="score-orbs" id="my-score-orbs"></div>
        </div>
        <div style="text-align:left; margin-bottom:6px;">
          <button id="end-match-btn" class="small">End Match</button>
        </div>
        <div class="active-row" id="my-active-row"></div>
        <div class="my-zone-row" style="display:flex; align-items:center; justify-content:center; gap:28px; margin-top:16px; flex-wrap:wrap;">
          <div class="card-face" id="my-discard-pile" data-seat="__discard__" data-zone="discard" data-index="0" style="border-style:dashed; flex-shrink:0;">
            <div class="label" id="discard-label">Discard</div>
          </div>
          <div style="width:1px; align-self:stretch; background:rgba(255,255,255,0.15);"></div>
          <div class="bench-row" id="my-bench" style="margin:0;"></div>
          <div style="width:1px; align-self:stretch; background:rgba(255,255,255,0.15);"></div>
          <div id="action-bar" style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;"></div>
        </div>
        <div class="row-label" id="my-zone-counts"></div>
      </div>
    </div>
    <div class="chat-col">
      <h3>Table Chat</h3>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Say something...">
        <button id="chat-send-btn" class="small">Send</button>
      </div>
    </div>
  </div>
  <div class="hand-strip">
    <h3>Your Hand</h3>
    <span id="hand-count" style="font-size:10px; color:var(--text-muted);"></span>
    <div class="hand-list" id="hand-list"></div>
  </div>
</div>

<div id="energy-picker"></div>
<div id="status-picker"></div>
<div id="end-match-picker"></div>

<div id="lightbox-overlay">
  <img id="lightbox-img" src="" alt="">
</div>

<script src="shared-header.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ykfuhvkjknrhocmahelx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_eyQa19eT_dhAEKFxTLNX5Q_AqsL7HSl";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CARD_IMAGE_BASE = "https://hxa.neocities.org/bakemon/cards/";
const ENERGY_TYPES = [
  { key: "fighting", color: "#e0997b" },
  { key: "grass", color: "#97c459" },
  { key: "fire", color: "#e8734a" },
  { key: "water", color: "#5fa8d3" },
  { key: "dark", color: "#6b5b7a" },
  { key: "psychic", color: "#c77dd4" },
  { key: "steel", color: "#a8b0b8" },
  { key: "electric", color: "#e8d24a" },
  { key: "dragon", color: "#7a6de0" },
  { key: "fairy", color: "#f2a8d0" },
  { key: "normal", color: "#c9c2a8" }
];
const STATUS_TYPES = ["poison", "burn", "sleep", "paralysis"];

let allCards = {};       // card_id -> card row
let currentPlayer = null;
let currentDeckId = null;
let tableId = null;
let roomCode = null;
let mySeat = null;       // "player_1" or "player_2"
let oppSeat = null;
let oppDisplayName = null;
let oppNameFetchedForId = null;
let tableState = null;   // full row from battle_tables
let selection = null;    // { seat, zone, index } of currently selected card
let realtimeChannel = null;

const BAKEMON_TABLE_KEY = "bakemon_active_table";

function getSavedTable() {
  try {
    const raw = localStorage.getItem(BAKEMON_TABLE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function saveTable(tableIdToSave, roomCodeToSave) {
  localStorage.setItem(BAKEMON_TABLE_KEY, JSON.stringify({ tableId: tableIdToSave, roomCode: roomCodeToSave }));
}
function clearSavedTable() {
  localStorage.removeItem(BAKEMON_TABLE_KEY);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

// ---------- Setup screen ----------
async function initSetupScreen() {
  const stored = window.getBakemonPlayer();
  if (!stored) {
    location.href = "index.html";
    return;
  }
  currentPlayer = stored;

  // Auto-rejoin: if we have a remembered table, check it's still real and we're
  // still legitimately seated there before skipping the manual room-code entry.
  const saved = getSavedTable();
  if (saved && saved.tableId) {
    const { data: cards } = await supabaseClient.from("cards").select("*");
    (cards || []).forEach(c => { allCards[c.id] = c; });

    const { data: savedTableRow } = await supabaseClient.from("battle_tables").select("*").eq("id", saved.tableId).maybeSingle();
    const stillSeated = savedTableRow && (savedTableRow.player_1_id === currentPlayer.id || savedTableRow.player_2_id === currentPlayer.id);
    const seatAlreadyHasState = stillSeated && savedTableRow.state && savedTableRow.state[savedTableRow.player_1_id === currentPlayer.id ? "player_1" : "player_2"];
    if (stillSeated && seatAlreadyHasState) {
      const rejoinStatusEl = document.getElementById("setup-status");
      rejoinStatusEl.textContent = "Rejoining your match...";
      await joinTableByCode(savedTableRow.room_code, rejoinStatusEl);
      return; // skip the rest of setup entirely — we're back in the match
    }
    // Table's gone, we're not seated there, or we never actually finished joining — clean up and fall through to normal setup.
    clearSavedTable();
  }

  const { data: decks } = await supabaseClient.from("decks").select("*").eq("player_id", currentPlayer.id).order("created_at");
  const sel = document.getElementById("deck-select-setup");
  sel.innerHTML = "";
  if (!decks || decks.length === 0) {
    sel.innerHTML = "<option>No decks yet — build one in the deck editor first</option>";
    return;
  }
  decks.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.id;
    opt.textContent = d.deck_name;
    sel.appendChild(opt);
  });
}

document.getElementById("join-btn").addEventListener("click", handleJoinTable);

async function handleJoinTable() {
  const deckId = document.getElementById("deck-select-setup").value;
  const code = document.getElementById("room-code-input").value.trim().toUpperCase();
  const statusEl = document.getElementById("setup-status");

  if (!code) { statusEl.textContent = "Enter a room code to create or join a table."; return; }
  if (!currentPlayer) {
    statusEl.textContent = "Couldn't find that player — check the deck editor first.";
    return;
  }
  if (!deckId || deckId.startsWith("No decks")) {
    statusEl.textContent = "Pick a deck — build one in the deck editor if you don't have one.";
    return;
  }
  currentDeckId = deckId;

  statusEl.textContent = "Loading card data...";
  const { data: cards } = await supabaseClient.from("cards").select("*");
  (cards || []).forEach(c => { allCards[c.id] = c; });

  await joinTableByCode(code, statusEl);
}

// Shared seating logic: given a room code, find-or-create the table, work out which seat
// we're in, and enter the mat screen. Used by both manual join and auto-rejoin on page load.
async function joinTableByCode(code, statusEl) {
  roomCode = code;
  statusEl.textContent = "Connecting to table...";
  let { data: existingTable } = await supabaseClient.from("battle_tables").select("*").eq("room_code", code).maybeSingle();

  if (!existingTable) {
    const { data: created, error } = await supabaseClient.from("battle_tables").insert({
      room_code: code,
      player_1_id: currentPlayer.id,
      state: { player_1: null, player_2: null, setup_locked: false }
    }).select().single();
    if (error) { statusEl.textContent = "Couldn't create table: " + error.message; return; }
    existingTable = created;
    mySeat = "player_1";
    oppSeat = "player_2";
  } else if (existingTable.player_1_id === currentPlayer.id) {
    mySeat = "player_1";
    oppSeat = "player_2";
  } else if (!existingTable.player_2_id) {
    const { data: updated, error } = await supabaseClient.from("battle_tables")
      .update({ player_2_id: currentPlayer.id })
      .eq("id", existingTable.id).select().single();
    if (error) { statusEl.textContent = "Couldn't join table: " + error.message; return; }
    existingTable = updated;
    mySeat = "player_2";
    oppSeat = "player_1";
  } else if (existingTable.player_2_id === currentPlayer.id) {
    mySeat = "player_2";
    oppSeat = "player_1";
  } else {
    statusEl.textContent = "That table already has two players.";
    return;
  }

  tableId = existingTable.id;
  tableState = existingTable;
  saveTable(tableId, roomCode);

  if (!tableState.state[mySeat]) {
    await loadDeckIntoSeat();
  }

  document.getElementById("setup-screen").style.display = "none";
  document.getElementById("mat-screen").style.display = "block";
  buildActionBar();
  subscribeToTable();
  await refreshOppName();
  await loadChatHistory();
  subscribeToChat();
  setupChatInput();
  renderMat();
}

async function refreshOppName() {
  const oppId = oppSeat === "player_1" ? tableState.player_1_id : tableState.player_2_id;
  if (!oppId) { oppDisplayName = null; return; }
  if (oppNameFetchedForId === oppId) return; // already have it
  const { data } = await supabaseClient.from("players").select("display_name").eq("id", oppId).maybeSingle();
  oppDisplayName = data ? data.display_name : "Opponent";
  oppNameFetchedForId = oppId;
}

async function loadDeckIntoSeat() {
  const { data: deckCards } = await supabaseClient.from("deck_cards").select("card_id, quantity").eq("deck_id", currentDeckId);
  let pile = [];
  (deckCards || []).forEach(row => {
    for (let i = 0; i < row.quantity; i++) pile.push(row.card_id);
  });
  // shuffle
  for (let i = pile.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pile[i], pile[j]] = [pile[j], pile[i]];
  }
  const newSeatState = {
    active: null,
    bench: [null, null, null],
    item_slot: null,
    hand: [],
    deck: pile,
    discard: [],
    score: 0,
    deck_id: currentDeckId
  };
  const newState = { ...tableState.state, [mySeat]: newSeatState };
  await pushState(newState);
}

// ---------- Table chat ----------
let chatMessages = [];
let chatChannel = null;

async function loadChatHistory() {
  const { data, error } = await supabaseClient
    .from("table_chat_messages")
    .select("*")
    .eq("table_id", tableId)
    .order("created_at", { ascending: true });
  if (error) { console.error(error); return; }
  chatMessages = data || [];
  renderChat();
}

function subscribeToChat() {
  chatChannel = supabaseClient
    .channel(`table_chat_${tableId}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "table_chat_messages", filter: `table_id=eq.${tableId}` },
      (payload) => {
        chatMessages.push(payload.new);
        renderChat();
      })
    .subscribe();
}

function renderChat() {
  const container = document.getElementById("chat-messages");
  if (!container) return;
  container.innerHTML = chatMessages.map(m => `
    <div class="chat-message ${m.player_id === currentPlayer.id ? 'own' : ''}">
      <span class="sender">${escapeHtml(m.sender_name)}:</span> ${escapeHtml(m.message)}
    </div>
  `).join("");
  container.scrollTop = container.scrollHeight;
}

function setupChatInput() {
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("chat-send-btn");
  const send = async () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";

    const messageToSend = resolveChatCommand(text);
    if (messageToSend === null) return; // command handled locally, nothing to send (e.g. unrecognized /command)

    const { error } = await supabaseClient.from("table_chat_messages").insert({
      table_id: tableId,
      player_id: currentPlayer.id,
      sender_name: currentPlayer.display_name,
      message: messageToSend
    });
    if (error) console.error("Failed to send chat message:", error);
  };
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });
}

// Recognizes chat commands and returns the actual message to send, or null to send nothing.
// Anything that isn't a recognized command is passed through unchanged as a normal message.
function resolveChatCommand(text) {
  const lower = text.toLowerCase();
  if (lower === "/flip" || lower === "/coin" || lower === "/coinflip") {
    const result = Math.random() < 0.5 ? "Heads" : "Tails";
    return `🪙 flipped a coin: ${result}`;
  }
  return text;
}

// ---------- Realtime sync ----------
function subscribeToTable() {
  realtimeChannel = supabaseClient
    .channel(`battle_table_${tableId}`)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "battle_tables", filter: `id=eq.${tableId}` },
      async (payload) => {
        tableState = payload.new;
        await refreshOppName();
        renderMat();
      })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "battle_tables", filter: `id=eq.${tableId}` },
      (payload) => {
        // Defensive check: DELETE filtering isn't always reliable server-side, so confirm
        // the deleted row is actually our table before reacting.
        if (payload.old && payload.old.id && payload.old.id !== tableId) return;
        handleMatchEndedByOpponent();
      })
    .subscribe();
}

function handleMatchEndedByOpponent() {
  if (realtimeChannel) {
    supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  if (chatChannel) {
    supabaseClient.removeChannel(chatChannel);
    chatChannel = null;
  }
  clearSavedTable();
  const matScreen = document.getElementById("mat-screen");
  matScreen.innerHTML = `
    <div style="max-width:420px; margin:80px auto; background:var(--mat-green); padding:28px; border-radius:12px; text-align:center;">
      <h2 style="color:var(--accent); margin-top:0;">Match ended</h2>
      <p style="color:var(--text-light);">${oppDisplayName || "Your opponent"} ended the match. Returning to the login screen...</p>
    </div>
  `;
  setTimeout(() => { location.reload(); }, 2500);
}

async function pushState(newState) {
  tableState = { ...tableState, state: newState };
  const { error } = await supabaseClient.from("battle_tables")
    .update({ state: newState, updated_at: new Date().toISOString() })
    .eq("id", tableId);
  if (error) console.error("Failed to save state:", error);
  renderMat();
}

// ---------- Rendering ----------
function handleEndMatch() {
  const picker = document.getElementById("end-match-picker");
  const myName = escapeHtml(currentPlayer.display_name);
  const oppId = (oppSeat === "player_1") ? tableState.player_1_id : tableState.player_2_id;
  const hasRealOpponent = !!oppId;
  const oppName = escapeHtml(oppDisplayName || "Opponent");

  const winButtons = hasRealOpponent
    ? `<button data-outcome="me" class="primary">${myName} won</button>
       <button data-outcome="opponent" class="primary">${oppName} won</button>`
    : "";
  const noOpponentNote = hasRealOpponent
    ? ""
    : `<p style="font-size:12px; color:var(--text-muted); margin:0; text-align:center;">No opponent ever joined this table — nothing to declare a winner between, so only "no decision" applies.</p>`;

  picker.innerHTML = `
    <h3>How did the match end?</h3>
    ${noOpponentNote}
    <div class="options">
      ${winButtons}
      <button data-outcome="none">No decision (don't count this one)</button>
      <button data-outcome="cancel">Cancel</button>
    </div>
  `;
  picker.style.display = "flex";
  picker.querySelectorAll("[data-outcome]").forEach(btn => {
    btn.addEventListener("click", () => {
      picker.style.display = "none";
      const outcome = btn.dataset.outcome;
      if (outcome === "cancel") return;
      finishEndMatch(outcome);
    });
  });
}

async function finishEndMatch(outcome) {
  // Figure out winner_id from the chosen outcome ("me" / "opponent" / "none")
  let winnerId = null;
  if (outcome === "me") winnerId = currentPlayer.id;
  else if (outcome === "opponent") winnerId = (oppSeat === "player_1") ? tableState.player_1_id : tableState.player_2_id;

  const p1DeckId = tableState.state.player_1 ? tableState.state.player_1.deck_id : null;
  const p2DeckId = tableState.state.player_2 ? tableState.state.player_2.deck_id : null;

  const { error: historyError } = await supabaseClient.from("match_history").insert({
    room_code: roomCode,
    player_1_id: tableState.player_1_id,
    player_1_deck_id: p1DeckId,
    player_2_id: tableState.player_2_id,
    player_2_deck_id: p2DeckId,
    winner_id: winnerId
  });
  if (historyError) console.error("Failed to save match history:", historyError);
  // Don't block ending the match on a history-save failure — the match itself still needs to end cleanly.

  if (realtimeChannel) {
    supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  if (chatChannel) {
    supabaseClient.removeChannel(chatChannel);
    chatChannel = null;
  }

  const { error } = await supabaseClient.from("battle_tables").delete().eq("id", tableId);
  if (error) {
    console.error(error);
    alert("Couldn't end the match — try again.");
    return;
  }

  clearSavedTable();
  location.reload();
}

function buildActionBar() {
  const bar = document.getElementById("action-bar");
  bar.innerHTML = `
    <button id="draw-btn" class="small">Draw Card</button>
    <button id="shuffle-hand-btn" class="small">Shuffle Hand<br>Into Deck</button>
    <button id="reshuffle-discard-btn" class="small">Reshuffle Discard<br>Into Deck</button>
  `;
  document.getElementById("draw-btn").addEventListener("click", drawCard);
  document.getElementById("shuffle-hand-btn").addEventListener("click", shuffleHandIntoDeck);
  document.getElementById("reshuffle-discard-btn").addEventListener("click", reshuffleDiscardIntoDeck);
  document.getElementById("end-match-btn").addEventListener("click", handleEndMatch);
  document.getElementById("start-match-btn").addEventListener("click", handleStartMatch);
}

async function handleStartMatch() {
  const newState = JSON.parse(JSON.stringify(tableState.state));
  newState.setup_locked = true;
  await pushState(newState);
}

function benchHpLine(slot, seat, index, viewOnly) {
  if (!slot || !slot.card_id) return "";
  const card = allCards[slot.card_id];
  if (!card) return "";
  const maxHp = card.hp;
  const remaining = Math.max(0, maxHp - (slot.damage || 0));
  if (viewOnly) {
    return `<div style="font-size:9px; color:#e0c9a8; text-align:center;">${remaining} / ${maxHp}</div>`;
  }
  return `
    <div style="display:flex; align-items:center; justify-content:center; gap:3px; font-size:9px; color:#e0c9a8;">
      <button class="small" style="padding:0 4px; font-size:10px;" data-bench-dmg-minus data-seat="${seat}" data-index="${index}">-</button>
      <span>${remaining} / ${maxHp}</span>
      <button class="small" style="padding:0 4px; font-size:10px;" data-bench-dmg-plus data-seat="${seat}" data-index="${index}">+</button>
    </div>
  `;
}

function cardHtml(cardId, opts = {}) {
  const card = allCards[cardId];
  if (!card) return `<div class="card-face empty"></div>`;
  const imgUrl = card.image_filename ? `${CARD_IMAGE_BASE}${card.image_filename}` : "";
  const img = imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none'">` : "";
  const zoomBtn = imgUrl ? `<button class="zoom-btn" data-zoom-src="${imgUrl}" data-zoom-alt="${escapeHtml(card.name)}" title="View larger">🔍</button>` : "";
  // Only show the text name label when there's no image to identify the card by —
  // once real art is showing, the card's own printed name (plus zoom) makes this redundant.
  const label = imgUrl ? "" : `<div class="label">${escapeHtml(card.name)}</div>`;
  return `${zoomBtn}${img}${label}`;
}

function renderSidePanel(seat, zone, index, slot) {
  if (!slot || !slot.card_id) return "";
  const card = allCards[slot.card_id];
  const maxHp = card ? card.hp : 0;
  const remaining = Math.max(0, maxHp - (slot.damage || 0));
  const energyDots = (slot.energy || []).map((e, i) => {
    const meta = ENERGY_TYPES.find(t => t.key === e) || { color: "#999" };
    return `<span class="energy-dot" style="background:${meta.color}" data-remove-energy="${i}" title="${e} (click to remove)"></span>`;
  }).join("");
  const statusBadges = (slot.status || []).map(s => `<span class="status-badge" data-remove-status="${s}" title="click to clear">${s}</span>`).join("");
  return `
    <div class="side-panel" data-seat="${seat}" data-zone="${zone}" data-index="${index}">
      <div class="row" style="width:100%; justify-content:space-between;">${statusBadges}</div>
      <div>Energy</div>
      <div class="energy-dots" data-energy-target="${seat}:${zone}:${index}">${energyDots}<span class="energy-dot" style="background:transparent; border:1px dashed #e0c9a8;" data-add-energy="1">+</span></div>
      <div class="divider-line" style="width:100%;"></div>
      <div class="dmg-controls">
        <button data-dmg-minus="1">-</button>
        <span class="remaining">${remaining}<span style="font-size:8px; font-weight:400;"> / ${maxHp}</span></span>
        <button data-dmg-plus="1">+</button>
      </div>
      <button class="small" data-add-status="1" style="margin-top:2px;">+ status</button>
    </div>
  `;
}

// Read-only variant for viewing the opponent's board — same info, no edit controls
function renderReadOnlySidePanel(slot) {
  if (!slot || !slot.card_id) return "";
  const card = allCards[slot.card_id];
  const maxHp = card ? card.hp : 0;
  const remaining = Math.max(0, maxHp - (slot.damage || 0));
  const energyDots = (slot.energy || []).map(e => {
    const meta = ENERGY_TYPES.find(t => t.key === e) || { color: "#999" };
    return `<span class="energy-dot" style="background:${meta.color}"></span>`;
  }).join("");
  const statusBadges = (slot.status || []).map(s => `<span class="status-badge">${s}</span>`).join("");
  return `
    <div class="side-panel" data-view-only="1">
      <div class="row" style="width:100%; justify-content:space-between; flex-wrap:wrap;">${statusBadges}</div>
      <div>Energy</div>
      <div class="energy-dots">${energyDots || '<span style="font-size:9px; opacity:0.6;">none</span>'}</div>
      <div class="divider-line" style="width:100%;"></div>
      <div class="remaining">${remaining}<span style="font-size:8px; font-weight:400;"> / ${maxHp}</span></div>
    </div>
  `;
}

function renderMat() {
  if (!tableState) return;
  const myState = tableState.state[mySeat] || { active: null, bench: [null,null,null], hand: [], deck: [], discard: [] };
  const oppState = tableState.state[oppSeat] || { active: null, bench: [null,null,null], hand: [], deck: [], discard: [] };

  document.getElementById("opp-name-label").textContent = oppDisplayName || "Waiting for opponent...";
  document.getElementById("opp-zone-counts").textContent =
    `Deck ${ (oppState.deck||[]).length } · Discard ${ (oppState.discard||[]).length } · Hand ${ (oppState.hand||[]).length }`;
  document.getElementById("my-zone-counts").innerHTML =
    `<span>${escapeHtml(currentPlayer.display_name)}</span><span>Deck ${ (myState.deck||[]).length } · Discard ${ (myState.discard||[]).length }</span>`;

  const WIN_SCORE = 4;
  document.getElementById("opp-score-orbs").innerHTML = Array.from({length: WIN_SCORE}, (_, i) => `
    <div class="score-orb ${(oppState.score || 0) > i ? 'filled' : ''}"></div>
  `).join("");
  document.getElementById("my-score-orbs").innerHTML = Array.from({length: WIN_SCORE}, (_, i) => `
    <div class="score-orb ${(myState.score || 0) > i ? 'filled' : ''}" data-score-index="${i}"></div>
  `).join("");

  const setupLocked = !!tableState.state.setup_locked;
  document.getElementById("start-match-banner").style.display = setupLocked ? "none" : "block";

  // Opponent bench — during setup, show face-down placeholders instead of real cards so
  // neither player can see what the other is placing before the match officially starts.
  document.getElementById("opp-bench").innerHTML = (oppState.bench || [null,null,null]).map((slot, i) => {
    if (!setupLocked) {
      return `
        <div class="bench-slot">
          <div class="card-face ${slot ? 'face-down' : 'empty'}" data-view-only="1"></div>
        </div>
      `;
    }
    return `
    <div class="bench-slot">
      <div class="card-face ${slot ? '' : 'empty'}" data-view-only="1">
        ${slot ? `<div class="status-badges">${(slot.status||[]).map(s=>`<span class="status-badge">${s}</span>`).join('')}</div>${cardHtml(slot.card_id)}` : ''}
      </div>
      ${benchHpLine(slot, oppSeat, i, true)}
      <div class="bench-tray" data-view-only="1">${(slot && slot.energy || []).map(e => {
        const meta = ENERGY_TYPES.find(t => t.key === e) || {color:"#999"};
        return `<span class="energy-dot" style="background:${meta.color}; width:8px; height:8px;"></span>`;
      }).join('')}</div>
    </div>
  `;
  }).join("");

  document.getElementById("opp-active-row").innerHTML = setupLocked ? `
    <div class="card-face item-slot ${oppState.item_slot ? '' : 'empty'}" data-view-only="1">
      ${oppState.item_slot ? cardHtml(oppState.item_slot.card_id) : '<div class="label">Item<br>equipped</div>'}
    </div>
    <div class="card-face active-size" data-view-only="1">
      ${oppState.active ? `<div class="status-badges">${(oppState.active.status||[]).map(s=>`<span class="status-badge">${s}</span>`).join('')}</div>${cardHtml(oppState.active.card_id)}` : ''}
    </div>
    ${renderReadOnlySidePanel(oppState.active)}
  ` : `
    <div class="card-face item-slot empty" data-view-only="1"></div>
    <div class="card-face active-size face-down" data-view-only="1"></div>
  `;

  document.getElementById("my-active-row").innerHTML = `
    <div class="card-face item-slot ${myState.item_slot ? '' : 'empty'} ${selection && selection.seat===mySeat && selection.zone==='item_slot' ? 'selected' : ''}"
         data-seat="${mySeat}" data-zone="item_slot" data-index="0">
      ${myState.item_slot ? cardHtml(myState.item_slot.card_id) : '<div class="label">Item<br>equipped</div>'}
    </div>
    <div class="card-face active-size selectable ${selection && selection.seat===mySeat && selection.zone==='active' ? 'selected' : ''}"
         data-seat="${mySeat}" data-zone="active" data-index="0">
      ${myState.active ? cardHtml(myState.active.card_id) : ''}
    </div>
    ${renderSidePanel(mySeat, 'active', 0, myState.active)}
  `;

  document.getElementById("my-bench").innerHTML = (myState.bench || [null,null,null]).map((slot, i) => `
    <div class="bench-slot">
      <div class="card-face ${slot ? '' : 'empty'} ${selection && selection.seat===mySeat && selection.zone==='bench' && selection.index===i ? 'selected' : ''}"
           data-seat="${mySeat}" data-zone="bench" data-index="${i}">
        ${slot ? cardHtml(slot.card_id) : ''}
      </div>
      ${benchHpLine(slot, mySeat, i, false)}
      <div class="bench-tray" data-seat="${mySeat}" data-zone="bench" data-index="${i}">
        ${(slot && slot.energy || []).map((e, ei) => {
          const meta = ENERGY_TYPES.find(t => t.key === e) || {color:"#999"};
          return `<span class="energy-dot" style="background:${meta.color}" data-remove-energy="${ei}" title="${e} (click to remove)"></span>`;
        }).join('')}
        ${slot ? `<span class="energy-dot" style="background:transparent; border:1px dashed #e0c9a8;" data-add-energy="1">+</span>` : ''}
      </div>
    </div>
  `).join("");

  document.getElementById("hand-count").textContent = `${(myState.hand||[]).length} cards`;
  document.getElementById("hand-list").innerHTML = (myState.hand || []).map((cardId, i) => `
    <div class="card-face hand-card ${selection && selection.seat===mySeat && selection.zone==='hand' && selection.index===i ? 'selected' : ''}"
         data-seat="${mySeat}" data-zone="hand" data-index="${i}">
      ${cardHtml(cardId)}
    </div>
  `).join("");

  document.getElementById("my-discard-pile").innerHTML = (myState.discard && myState.discard.length)
    ? cardHtml(myState.discard[myState.discard.length - 1]) + `<div class="label" style="position:absolute; bottom:0; width:100%;">${myState.discard.length} in discard</div>`
    : `<div class="label">Discard<br>(empty)</div>`;

  document.getElementById("opp-discard-pile").innerHTML = (oppState.discard && oppState.discard.length)
    ? cardHtml(oppState.discard[oppState.discard.length - 1]) + `<div class="label" style="position:absolute; bottom:0; width:100%;">${oppState.discard.length} in discard</div>`
    : `<div class="label">Discard<br>(empty)</div>`;

  updateSelectionHint();
  attachHandlers();
}

let flashMessage = null;
let flashMessageTimer = null;

function setStatus(msg) {
  flashMessage = msg;
  if (flashMessageTimer) clearTimeout(flashMessageTimer);
  updateSelectionHint();
  flashMessageTimer = setTimeout(() => {
    flashMessage = null;
    updateSelectionHint();
  }, 2500);
}

function updateSelectionHint() {
  const hint = document.getElementById("selection-hint");
  if (flashMessage) {
    hint.textContent = flashMessage;
    return;
  }
  if (!selection) {
    hint.textContent = "Click a card to select it, then click where you want to move it.";
  } else {
    hint.textContent = `Selected a card from ${selection.zone}. Click a destination (hand, bench, active, or discard) to move it there. Click the same card again to cancel.`;
  }
}

// ---------- Interaction ----------
function attachHandlers() {
  document.querySelectorAll("#my-score-orbs [data-score-index]").forEach(el => {
    el.addEventListener("click", () => {
      const clickedIndex = parseInt(el.dataset.scoreIndex);
      const newState = JSON.parse(JSON.stringify(tableState.state));
      const myState = newState[mySeat];
      const currentScore = myState.score || 0;
      // Clicking the topmost filled orb again removes a point; otherwise fill up to the clicked orb
      myState.score = (currentScore === clickedIndex + 1) ? clickedIndex : clickedIndex + 1;
      pushState(newState);
    });
  });
  document.querySelectorAll(".zoom-btn[data-zoom-src]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      openLightbox(el.dataset.zoomSrc, el.dataset.zoomAlt);
    });
  });
  document.querySelectorAll("[data-bench-dmg-plus]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); adjustBenchDamage(el.dataset.seat, parseInt(el.dataset.index), -10); });
  });
  document.querySelectorAll("[data-bench-dmg-minus]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); adjustBenchDamage(el.dataset.seat, parseInt(el.dataset.index), 10); });
  });
  document.querySelectorAll(".card-face[data-seat]:not([data-view-only])").forEach(el => {
    if (el.dataset.seat === "__discard__") {
      el.addEventListener("click", () => handleDiscardClick());
    } else {
      el.addEventListener("click", () => handleCardClick(el.dataset.seat, el.dataset.zone, parseInt(el.dataset.index)));
    }
  });
  document.querySelectorAll("[data-dmg-plus]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); adjustDamage(e.target.closest(".side-panel"), -10); });
  });
  document.querySelectorAll("[data-dmg-minus]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); adjustDamage(e.target.closest(".side-panel"), 10); });
  });
  document.querySelectorAll("[data-add-energy]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); openEnergyPicker(e.target.closest("[data-seat]")); });
  });
  document.querySelectorAll("[data-remove-energy]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); removeEnergy(e.target.closest("[data-seat]"), parseInt(e.target.dataset.removeEnergy)); });
  });
  document.querySelectorAll("[data-add-status]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); openStatusPicker(e.target.closest(".side-panel")); });
  });
  document.querySelectorAll("[data-remove-status]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); removeStatus(e.target.closest(".side-panel"), e.target.dataset.removeStatus); });
  });
}

function getSlot(state, zone, index) {
  if (zone === "active") return state.active;
  if (zone === "bench") return (state.bench || [])[index];
  if (zone === "item_slot") return state.item_slot;
  return null;
}
function setSlot(state, zone, index, value) {
  if (zone === "active") state.active = value;
  else if (zone === "bench") { state.bench = state.bench || [null,null,null]; state.bench[index] = value; }
  else if (zone === "item_slot") state.item_slot = value;
}

function handleDiscardClick() {
  if (!selection) return; // nothing selected, clicking discard alone does nothing
  moveSelectedCardTo("discard", 0);
}

function handleCardClick(seat, zone, index) {
  if (seat !== mySeat) return; // can't interact with opponent's cards

  const myState = tableState.state[mySeat];

  if (!selection) {
    // Selecting a card to move — must have something there (or be hand, which is inherently non-empty if clicked)
    if (zone === "hand" && myState.hand[index] !== undefined) {
      selection = { seat, zone, index };
    } else if ((zone === "active" || zone === "bench" || zone === "item_slot") && getSlot(myState, zone, index)) {
      selection = { seat, zone, index };
    }
    renderMat();
    return;
  }

  // Clicking the same spot again cancels
  if (selection.zone === zone && selection.index === index) {
    selection = null;
    renderMat();
    return;
  }

  moveSelectedCardTo(zone, index);
}

function moveSelectedCardTo(destZone, destIndex) {
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const myState = newState[mySeat];

  // Item equip slot: only accepts item cards with item_kind = 'equip'. Not part of the
  // Bakemon swap/evolution logic below — it's a simple single-card slot.
  if (destZone === "item_slot") {
    const incomingCard = selection.zone === "hand"
      ? allCards[myState.hand[selection.index]]
      : (getSlot(myState, selection.zone, selection.index) ? allCards[getSlot(myState, selection.zone, selection.index).card_id] : null);
    const isEquipItem = incomingCard && incomingCard.card_type === "item" && incomingCard.item_kind === "equip";
    if (!isEquipItem) {
      setStatus(incomingCard ? `${incomingCard.name} can't be equipped — only equip-type item cards go in that slot.` : "That slot only accepts equip-type item cards.");
      selection = null;
      pushState(newState);
      return;
    }
    const existingItem = myState.item_slot;
    if (existingItem) {
      setStatus("Unequip the current item first (move it to hand or discard) before equipping a new one.");
      selection = null;
      pushState(newState);
      return;
    }
    // Valid: place the item, pulling it from its source
    let itemCardId = null;
    if (selection.zone === "hand") {
      itemCardId = myState.hand[selection.index];
      myState.hand.splice(selection.index, 1);
    } else {
      const slot = getSlot(myState, selection.zone, selection.index);
      itemCardId = slot.card_id;
      setSlot(myState, selection.zone, selection.index, null);
    }
    myState.item_slot = { card_id: itemCardId };
    selection = null;
    pushState(newState);
    return;
  }
  // Selecting an equipped item to move it out (to hand or discard) — item_slot holds a bare { card_id }, no energy/damage/status to preserve
  if (selection.zone === "item_slot" && destZone !== "item_slot") {
    const itemCardId = myState.item_slot ? myState.item_slot.card_id : null;
    if (itemCardId) {
      myState.item_slot = null;
      if (destZone === "hand") {
        myState.hand.push(itemCardId);
      } else if (destZone === "discard") {
        myState.discard = myState.discard || [];
        myState.discard.push(itemCardId);
      }
    }
    selection = null;
    pushState(newState);
    return;
  }

  // Played cards (active/bench) never return to hand — hand can't store their energy/damage/status/
  // evolution history, and there's no game reason for it. Block this rather than silently losing data.
  const sourceIsInPlay = selection.zone === "active" || selection.zone === "bench";
  if (sourceIsInPlay && destZone === "hand") {
    setStatus("A played Bakemon can't go back to your hand. Move it to discard instead if you need to remove it.");
    selection = null;
    pushState(newState);
    return;
  }

  // Special case: moving between two in-play zones (active<->bench, bench<->bench) onto an occupied slot.
  // If it's not a valid evolution, swap the two cards in place rather than bumping either to hand.
  const destIsInPlay = destZone === "active" || destZone === "bench";
  if (sourceIsInPlay && destIsInPlay && !(selection.zone === destZone && selection.index === destIndex)) {
    const sourceSlot = getSlot(myState, selection.zone, selection.index);
    const destSlot = getSlot(myState, destZone, destIndex);
    if (destSlot) {
      const incomingCard = sourceSlot ? allCards[sourceSlot.card_id] : null;
      const isValidEvolution = incomingCard && incomingCard.evolves_from && destSlot.card_id &&
        allCards[destSlot.card_id] &&
        incomingCard.evolves_from.toLowerCase() === allCards[destSlot.card_id].name.toLowerCase();
      if (!isValidEvolution) {
        // Straight swap: each card keeps its own damage/energy/status/evolution chain, just trades places
        setSlot(myState, selection.zone, selection.index, destSlot);
        setSlot(myState, destZone, destIndex, sourceSlot);
        selection = null;
        pushState(newState);
        return;
      }
      // else: fall through to the evolution logic below, which already handles this case correctly
    }
  }

  // Get the full card data being moved (preserving energy/damage/status if it's already in play), and remove it from its source
  let cardId = null;
  let movingSlot = null; // full slot data if moving from active/bench, null if from hand
  if (selection.zone === "hand") {
    cardId = myState.hand[selection.index];
    myState.hand.splice(selection.index, 1);
  } else {
    const slot = getSlot(myState, selection.zone, selection.index);
    if (slot) {
      cardId = slot.card_id;
      movingSlot = slot;
      setSlot(myState, selection.zone, selection.index, null);
    }
  }

  if (!cardId) { selection = null; pushState(newState); return; }

  // Place it at the destination
  if (destZone === "hand") {
    myState.hand.push(cardId);
  } else if (destZone === "discard") {
    myState.discard = myState.discard || [];
    // If this was an evolved stack (active/bench card being discarded), send the whole chain to discard, not just the top card
    if (movingSlot && movingSlot.evolved_from && movingSlot.evolved_from.length) {
      myState.discard.push(...movingSlot.evolved_from);
    }
    myState.discard.push(cardId);
  } else if (destZone === "active" || destZone === "bench") {
    const existing = getSlot(myState, destZone, destIndex);
    const incomingCard = allCards[cardId];

    // Active/bench are Bakemon-only zones — items belong in the item slot or hand/discard.
    if (incomingCard && incomingCard.card_type === "item") {
      setStatus(`${incomingCard.name} is an item card — it goes in the item slot, not active or bench.`);
      if (selection.zone === "hand") {
        myState.hand.push(cardId);
      } else if (movingSlot) {
        setSlot(myState, selection.zone, selection.index, movingSlot);
      }
      selection = null;
      pushState(newState);
      return;
    }

    const evolvesFromExisting = existing && incomingCard && incomingCard.evolves_from &&
      existing.card_id && allCards[existing.card_id] &&
      incomingCard.evolves_from.toLowerCase() === allCards[existing.card_id].name.toLowerCase();

    // An evolution card can't enter play on its own, and can't be placed onto the wrong base — it must go onto its actual pre-evolution.
    // This only applies when the card is coming from hand (genuinely entering play); a card that's
    // already in play (bench/active) simply moving to another in-play zone has already legally evolved
    // at some earlier point, and its own evolves_from lineage shouldn't be re-checked on ordinary movement.
    const enteringPlayFromHand = selection.zone === "hand";
    if (enteringPlayFromHand && incomingCard && incomingCard.evolves_from && !evolvesFromExisting) {
      const reason = existing
        ? `${incomingCard.name} evolves from ${incomingCard.evolves_from}, not ${allCards[existing.card_id]?.name || 'that card'}.`
        : `${incomingCard.name} evolves from ${incomingCard.evolves_from} — place it onto that card, not an empty slot.`;
      setStatus(reason);
      // Put the card back where it came from rather than losing it
      if (selection.zone === "hand") {
        myState.hand.push(cardId);
      } else if (movingSlot) {
        setSlot(myState, selection.zone, selection.index, movingSlot);
      }
      selection = null;
      pushState(newState);
      return;
    }

    if (existing && evolvesFromExisting) {
      // Evolution: stack on top, carrying damage/energy/status forward, tracking the evolution chain for later discard
      const priorChain = existing.evolved_from || [];
      setSlot(myState, destZone, destIndex, {
        card_id: cardId,
        evolved_from: [...priorChain, existing.card_id],
        damage: existing.damage || 0,
        energy: existing.energy || [],
        status: existing.status || []
      });
    } else if (existing) {
      // Slot is occupied and this isn't a valid evolution — refuse the move rather than bumping
      // whatever's there back to hand. Played cards should never return to hand automatically;
      // the player must explicitly move the existing card out (e.g. to bench or discard) first.
      setStatus(`That slot already has a Bakemon in it. Move it out first before placing a new one there.`);
      if (selection.zone === "hand") {
        myState.hand.push(cardId);
      } else if (movingSlot) {
        setSlot(myState, selection.zone, selection.index, movingSlot);
      }
      selection = null;
      pushState(newState);
      return;
    } else {
      // Slot is empty — place freely
      const newSlot = movingSlot
        ? { card_id: cardId, evolved_from: movingSlot.evolved_from || [], damage: movingSlot.damage || 0, energy: movingSlot.energy || [], status: movingSlot.status || [] }
        : { card_id: cardId, evolved_from: [], damage: 0, energy: [], status: [] };
      setSlot(myState, destZone, destIndex, newSlot);
    }
  }

  selection = null;
  pushState(newState);
}

async function drawCard() {
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const myState = newState[mySeat];
  if (!myState.deck || myState.deck.length === 0) return;
  const drawn = myState.deck.shift();
  myState.hand.push(drawn);
  pushState(newState);
}

async function shuffleHandIntoDeck() {
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const myState = newState[mySeat];
  myState.deck = [...(myState.deck||[]), ...(myState.hand||[])];
  myState.hand = [];
  for (let i = myState.deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [myState.deck[i], myState.deck[j]] = [myState.deck[j], myState.deck[i]];
  }
  pushState(newState);
}

async function reshuffleDiscardIntoDeck() {
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const myState = newState[mySeat];
  if (!myState.discard || myState.discard.length === 0) return;
  myState.deck = [...(myState.deck||[]), ...myState.discard];
  myState.discard = [];
  for (let i = myState.deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [myState.deck[i], myState.deck[j]] = [myState.deck[j], myState.deck[i]];
  }
  pushState(newState);
}

function adjustDamage(panelEl, delta) {
  if (!panelEl) return;
  const { seat, zone, index } = panelEl.dataset;
  if (seat !== mySeat) return;
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const slot = getSlot(newState[seat], zone, parseInt(index));
  if (!slot) return;
  slot.damage = Math.max(0, (slot.damage || 0) + delta);
  pushState(newState);
}

function adjustBenchDamage(seat, index, delta) {
  if (seat !== mySeat) return;
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const slot = getSlot(newState[seat], "bench", index);
  if (!slot) return;
  slot.damage = Math.max(0, (slot.damage || 0) + delta);
  pushState(newState);
}

let energyPickerTarget = null;
function openEnergyPicker(panelEl) {
  if (!panelEl) return;
  const { seat, zone, index } = panelEl.dataset;
  if (seat !== mySeat) return;
  energyPickerTarget = { seat, zone, index: parseInt(index) };
  const picker = document.getElementById("energy-picker");
  picker.innerHTML = ENERGY_TYPES.map(t =>
    `<button style="background:${t.color}; border-color:#0003;" data-energy-type="${t.key}">${t.key}</button>`
  ).join("") + `<button id="energy-picker-close">Cancel</button>`;
  picker.style.display = "flex";
  picker.querySelectorAll("[data-energy-type]").forEach(b => {
    b.addEventListener("click", () => addEnergy(b.dataset.energyType));
  });
  document.getElementById("energy-picker-close").addEventListener("click", () => { picker.style.display = "none"; });
}
function addEnergy(type) {
  const { seat, zone, index } = energyPickerTarget;
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const slot = getSlot(newState[seat], zone, index);
  if (!slot) return;
  slot.energy = slot.energy || [];
  slot.energy.push(type);
  document.getElementById("energy-picker").style.display = "none";
  pushState(newState);
}
function removeEnergy(panelEl, energyIndex) {
  if (!panelEl) return;
  const { seat, zone, index } = panelEl.dataset;
  if (seat !== mySeat) return;
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const slot = getSlot(newState[seat], zone, parseInt(index));
  if (!slot || !slot.energy) return;
  slot.energy.splice(energyIndex, 1);
  pushState(newState);
}

let statusPickerTarget = null;
function openStatusPicker(panelEl) {
  if (!panelEl) return;
  const { seat, zone, index } = panelEl.dataset;
  if (seat !== mySeat) return;
  statusPickerTarget = { seat, zone, index: parseInt(index) };
  const picker = document.getElementById("status-picker");
  picker.innerHTML = STATUS_TYPES.map(s => `<button data-status-type="${s}">${s}</button>`).join("") + `<button id="status-picker-close">Cancel</button>`;
  picker.style.display = "flex";
  picker.querySelectorAll("[data-status-type]").forEach(b => {
    b.addEventListener("click", () => addStatus(b.dataset.statusType));
  });
  document.getElementById("status-picker-close").addEventListener("click", () => { picker.style.display = "none"; });
}
function addStatus(statusType) {
  const { seat, zone, index } = statusPickerTarget;
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const slot = getSlot(newState[seat], zone, index);
  if (!slot) return;
  slot.status = slot.status || [];
  if (!slot.status.includes(statusType)) slot.status.push(statusType);
  document.getElementById("status-picker").style.display = "none";
  pushState(newState);
}
function removeStatus(panelEl, statusType) {
  if (!panelEl) return;
  const { seat, zone, index } = panelEl.dataset;
  if (seat !== mySeat) return;
  const newState = JSON.parse(JSON.stringify(tableState.state));
  const slot = getSlot(newState[seat], zone, parseInt(index));
  if (!slot || !slot.status) return;
  slot.status = slot.status.filter(s => s !== statusType);
  pushState(newState);
}

function openLightbox(src, alt) {
  const overlay = document.getElementById("lightbox-overlay");
  const img = document.getElementById("lightbox-img");
  img.src = src;
  img.alt = alt || "";
  overlay.style.display = "flex";
}
document.getElementById("lightbox-overlay").addEventListener("click", () => {
  document.getElementById("lightbox-overlay").style.display = "none";
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("lightbox-overlay").style.display = "none";
});

initSetupScreen();
</script>
