<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakemon Recent Matches</title>
<style>
  :root {
    --mat-green: #1d4d3a;
    --card-cream: #fdf6e3;
    --card-border: #d9b25c;
    --accent: #d8e04a;
    --text-light: #cfe8db;
    --text-muted: #9fc7ae;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f2e22;
    color: #eee;
    min-height: 100vh;
  }

  #content { max-width: 700px; margin: 24px auto; padding: 0 16px; }

  h2 { color: var(--accent); text-align: center; margin-bottom: 4px; }
  #subheading {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 20px;
  }

  #match-list { display: flex; flex-direction: column; gap: 8px; }
  .match-row {
    background: #164634;
    border-radius: 8px;
    padding: 12px 16px;
    border-left: 4px solid var(--text-muted);
  }
  .match-row.decided { border-left-color: var(--accent); }

  .match-players {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    flex-wrap: wrap;
  }
  .match-players a { color: var(--text-light); text-decoration: none; }
  .match-players a:hover { color: var(--accent); text-decoration: underline; }
  .match-players .winner { color: var(--accent); }
  .match-players .vs { color: var(--text-muted); font-weight: 400; font-size: 12px; }

  .match-decks {
    display: flex;
    justify-content: center;
    gap: 10px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    flex-wrap: wrap;
    text-align: center;
  }

  .match-footer {
    display: flex;
    justify-content: center;
    gap: 10px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .match-outcome-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .match-outcome-label.decided { color: var(--accent); }

  #empty-message {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="bakemon-shared-header-slot"></div>

<div id="content">
  <h2>Recent Matches</h2>
  <div id="subheading">The last 25 matches played, across all players</div>
  <div style="text-align:center; margin-bottom:16px;">
  </div>

  <div id="match-list"></div>
  <div id="empty-message" style="display:none;">No matches played yet — go start one!</div>
</div>

<script src="shared-header.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ykfuhvkjknrhocmahelx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_eyQa19eT_dhAEKFxTLNX5Q_AqsL7HSl";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MATCH_LIMIT = 25;

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " +
         d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

async function loadRecentMatches() {
  // A solo table (nobody ever joined as player 2) has BOTH player_2_id and
  // player_2_deck_id null. A genuinely deleted player only has player_2_id
  // null — player_2_deck_id stays behind as a real value, since deck_id
  // isn't affected by a player being deleted later. Filtering on the deck
  // id (not just the player id) is what tells these two cases apart.
  const { data: matches, error } = await supabaseClient
    .from("match_history")
    .select("*")
    .not("player_2_deck_id", "is", null)
    .order("created_at", { ascending: false })
    .limit(MATCH_LIMIT);

  if (error) {
    console.error("Failed to load recent matches:", error);
    document.getElementById("empty-message").textContent = "Couldn't load recent matches — try refreshing.";
    document.getElementById("empty-message").style.display = "block";
    return;
  }

  if (!matches || matches.length === 0) {
    document.getElementById("empty-message").style.display = "block";
    return;
  }

  // Batch-fetch every player and deck name referenced, same pattern as
  // history.html/player.html — one query each rather than one per row.
  const playerIds = new Set();
  const deckIds = new Set();
  matches.forEach(m => {
    if (m.player_1_id) playerIds.add(m.player_1_id);
    if (m.player_2_id) playerIds.add(m.player_2_id);
    if (m.player_1_deck_id) deckIds.add(m.player_1_deck_id);
    if (m.player_2_deck_id) deckIds.add(m.player_2_deck_id);
  });

  const [{ data: players }, { data: decks }] = await Promise.all([
    playerIds.size ? supabaseClient.from("players").select("id, display_name").in("id", [...playerIds]) : Promise.resolve({ data: [] }),
    deckIds.size ? supabaseClient.from("decks").select("id, deck_name").in("id", [...deckIds]) : Promise.resolve({ data: [] })
  ]);
  const playerNameById = Object.fromEntries((players || []).map(p => [p.id, p.display_name]));
  const deckNameById = Object.fromEntries((decks || []).map(d => [d.id, d.deck_name]));

  const nameFor = (id) => id === null ? "Deleted Player" : (playerNameById[id] || "Unknown");
  const deckFor = (id) => id === null ? "Deleted Deck" : (deckNameById[id] || "Unknown deck");
  // Player names link to their profile when we have a real id to link to;
  // a deleted/unknown player has nothing to link to, so render plain text.
  const nameLinkFor = (id) => id
    ? `<a href="player.html?id=${id}">${escapeHtml(nameFor(id))}</a>`
    : escapeHtml(nameFor(id));

  const listEl = document.getElementById("match-list");
  listEl.innerHTML = matches.map(m => {
    const decided = m.winner_id !== null;
    const p1IsWinner = decided && m.winner_id === m.player_1_id;
    const p2IsWinner = decided && m.winner_id === m.player_2_id;

    return `
      <div class="match-row ${decided ? 'decided' : ''}">
        <div class="match-players">
          <span class="${p1IsWinner ? 'winner' : ''}">${nameLinkFor(m.player_1_id)}</span>
          <span class="vs">vs</span>
          <span class="${p2IsWinner ? 'winner' : ''}">${nameLinkFor(m.player_2_id)}</span>
        </div>
        <div class="match-decks">
          <span>${escapeHtml(deckFor(m.player_1_deck_id))}</span>
          <span>·</span>
          <span>${escapeHtml(deckFor(m.player_2_deck_id))}</span>
        </div>
        <div class="match-footer">
          <span>${formatDate(m.created_at)}</span>
          <span>·</span>
          <span class="match-outcome-label ${decided ? 'decided' : ''}">${decided ? 'Decided' : 'No Decision'}</span>
        </div>
      </div>
    `;
  }).join("");
}

loadRecentMatches();
</script>

</body>
</html>
