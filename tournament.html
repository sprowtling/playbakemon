<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakemon Tournament</title>
<script>document.documentElement.dataset.bakemonTheme = localStorage.getItem("bakemon_theme") || "felt";</script>
<link rel="stylesheet" href="shared-styles.css">
<style>
  /* This page's content column is wider than the shared 700px default —
     the bracket needs the room. */
  #content { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  /* The bracket itself needs real horizontal room to avoid scrolling on
     anything but a small screen — break it out of the 900px content cap
     specifically, while headings/banner above it stay at a readable width. */
  #bracket-screen { max-width: none; }
  #bracket-screen h2, #bracket-screen #subheading, #bracket-screen #champion-banner {
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---- Create screen ---- */
  #create-screen, #builder-screen {
    max-width: 640px;
    margin: 20px auto;
    background: var(--mat-green);
    padding: 24px;
    border-radius: 12px;
    box-shadow: var(--panel-shadow);
  }
  #create-screen label, #builder-screen label { display: block; font-size: 13px; color: var(--text-light); margin: 14px 0 6px; }
  #create-screen input[type="text"], .info-textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    box-sizing: border-box;
  }
  .info-textarea {
    min-height: 140px;
    resize: vertical;
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    background: var(--card-cream);
    color: var(--button-text);
  }
  .field-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ---- Sign-up screen ---- */
  #signup-screen { max-width: 640px; margin: 0 auto; }
  #signup-screen h2 { margin-bottom: 2px; }
  .host-line { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
  .host-line a { color: var(--accent); }
  .panel {
    background: var(--mat-green);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    box-shadow: var(--panel-shadow);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .panel h3 { color: var(--accent); font-size: 14px; margin: 0 0 10px; }
  /* Hosts write their rules with line breaks; keep them. */
  .info-text { white-space: pre-line; font-size: 14px; line-height: 1.55; color: var(--text-light); overflow-wrap: anywhere; }
  .info-text.empty { color: var(--text-muted); font-style: italic; }
  #signup-action { text-align: center; }
  #signup-action button { font-size: 15px; padding: 10px 26px; }
  #signup-action .note { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  #signup-list { display: flex; flex-direction: column; gap: 6px; }
  .signup-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--row-bg); border-radius: 6px; padding: 7px 12px; font-size: 13px;
  }
  .signup-row a { color: var(--text-light); }
  .signup-row a:hover { color: var(--accent); }
  .signup-row .num { color: var(--text-muted); font-size: 11px; margin-right: 8px; }
  .signup-row.me { outline: 1px solid var(--accent); }
  .host-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* Rules & info shown above a running or finished bracket */
  #bracket-info { max-width: 900px; margin: 0 auto 20px; }
  #bracket-info summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 14px; }
  #bracket-info .info-text { margin-top: 10px; }
  #bracket-size-row { display: flex; gap: 8px; }
  #bracket-size-row button { flex: 1; }
  #bracket-size-row button.selected { background: var(--accent); border-color: #a8b32e; }

  #slot-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .slot-btn {
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: rgba(0,0,0,0.15);
    color: var(--text-light);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .slot-btn:hover { background: rgba(255,255,255,0.05); }
  .slot-btn.filled { background: var(--mat-green-light); color: var(--accent); font-weight: 600; }
  .slot-btn .slot-num { color: var(--text-muted); font-size: 11px; margin-right: 6px; }
  #create-status, #builder-status { font-size: 13px; color: var(--text-muted); min-height: 18px; margin-top: 10px; }

  #slot-picker-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #slot-picker-backdrop.open { display: flex; }
  #slot-picker-modal {
    background: var(--mat-green);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    box-shadow: var(--panel-shadow);
    padding: 18px;
    max-width: 360px;
    width: 100%;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
  }
  #slot-picker-modal h3 { color: var(--accent); margin: 0 0 10px; font-size: 15px; }
  #slot-picker-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  #slot-picker-list button { text-align: left; }
  #slot-picker-close { margin-top: 12px; align-self: flex-end; }

  /* ---- Bracket ---- */
  #bracket {
    display: flex;
    gap: 32px;
    overflow-x: auto;
    padding: 16px 4px 24px;
  }
  .round-col { display: flex; flex-direction: column; justify-content: space-around; gap: 16px; min-width: 200px; }
  .round-title { text-align: center; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .match-box {
    background: var(--row-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-base);
    box-shadow: var(--panel-shadow);
    overflow: hidden;
  }
  .match-slot {
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text-light);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    cursor: default;
  }
  .match-slot:last-child { border-bottom: none; }
  /* Only a slot the viewer can actually act on (has the declare-winner
     hookup) gets the pointer cursor and hover feedback — otherwise it looks
     clickable to people who aren't allowed to declare a winner. */
  .match-slot[data-declare-winner] { cursor: pointer; }
  .match-slot[data-declare-winner]:hover { background: rgba(255,255,255,0.05); }
  .match-slot.winner { background: rgba(216,224,74,0.15); color: var(--accent); font-weight: 700; }
  .match-slot.empty { color: var(--text-muted); font-style: italic; }

  #champion-banner {
    display: none;
    text-align: center;
    background: var(--mat-green);
    border: 1px solid var(--accent);
    border-radius: 10px;
    box-shadow: var(--panel-shadow);
    padding: 16px;
    margin-bottom: 20px;
  }
  #champion-banner .crown { font-size: 24px; }
  #champion-banner .name { color: var(--accent); font-size: 20px; font-weight: 700; margin-top: 4px; }

  #back-link { display: block; text-align: center; margin-bottom: 16px; color: var(--text-light); font-size: 13px; text-decoration: none; }
  #back-link:hover { color: var(--accent); }
</style>
</head>
<body>

<div id="bakemon-shared-header-slot"></div>

<div id="content">
  <a id="back-link" href="tournaments.html">← All tournaments</a>

  <div id="create-screen" style="display:none;">
    <h2 style="margin-top:0;">New Tournament</h2>
    <label for="tournament-name-input">Tournament name</label>
    <input type="text" id="tournament-name-input" placeholder="e.g. Weekly Bakematch">

    <label for="tournament-info-input">Rules &amp; info</label>
    <textarea id="tournament-info-input" class="info-textarea" placeholder="When does it start? Any cards that are banned or required? Deck rules? Prizes? Anything players should know before signing up."></textarea>
    <div class="field-hint">Everyone sees this on the sign-up page, and above the bracket once it starts. You can edit it while sign-ups are open.</div>

    <div id="create-status"></div>
    <button class="primary" id="create-btn" style="margin-top:14px; width:100%;">Open Sign-ups</button>
  </div>

  <div id="signup-screen" style="display:none;">
    <h2 id="signup-title"></h2>
    <div class="host-line" id="signup-host"></div>

    <div class="panel">
      <h3>Rules &amp; info</h3>
      <div id="signup-info" class="info-text"></div>
      <div id="signup-info-editor" style="display:none;">
        <textarea id="signup-info-input" class="info-textarea"></textarea>
        <div style="margin-top:8px; display:flex; gap:8px; justify-content:flex-end;">
          <button class="small" id="info-cancel-btn">Cancel</button>
          <button class="small primary" id="info-save-btn">Save</button>
        </div>
      </div>
    </div>

    <div class="panel" id="signup-action"></div>

    <div class="panel">
      <h3 id="signup-count">Signed up</h3>
      <div id="signup-list"></div>
    </div>

    <div class="panel" id="host-panel" style="display:none;">
      <h3>Host tools</h3>
      <div class="host-tools">
        <button class="small" id="edit-info-btn">Edit rules &amp; info</button>
        <button class="small primary" id="close-signups-btn">Close sign-ups &amp; build bracket</button>
      </div>
    </div>
  </div>

  <div id="builder-screen" style="display:none;">
    <h2 style="margin-top:0;" id="builder-title">Build the bracket</h2>
    <div class="field-hint" id="builder-hint"></div>

    <label>Bracket size</label>
    <div id="bracket-size-row">
      <button data-size="4">4 players</button>
      <button data-size="8">8 players</button>
      <button data-size="16">16 players</button>
    </div>

    <label>Assign each slot. Click to pick a player, or leave empty for a "bye" (an uncontested match that lets an odd-numbered player to advance to the next round).</label>
    <div style="margin-top:8px;"><button type="button" class="small" id="fill-order-btn" style="display:none;">Fill slots in sign-up order</button></div>
    <div id="slot-grid"></div>

    <div id="builder-status"></div>
    <button class="primary" id="build-btn" style="margin-top:14px; width:100%;">Start Tournament</button>
    <button id="builder-back-btn" style="margin-top:8px; width:100%;">Back to sign-ups</button>
  </div>

  <div id="slot-picker-backdrop">
    <div id="slot-picker-modal">
      <h3 id="slot-picker-title">Choose a player</h3>
      <div id="slot-picker-list"></div>
      <button id="slot-picker-close" class="small">Cancel</button>
    </div>
  </div>

  <div id="bracket-screen" style="display:none;">
    <h2 id="tournament-title"></h2>
    <div id="subheading"></div>
    <div id="champion-banner">
      <div class="crown">🏆</div>
      <div class="name" id="champion-name"></div>
    </div>
    <details id="bracket-info" class="panel" style="display:none;">
      <summary>Rules &amp; info</summary>
      <div class="info-text" id="bracket-info-text"></div>
    </details>
    <div id="bracket"></div>
  </div>
</div>

<script src="shared-header.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ykfuhvkjknrhocmahelx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_eyQa19eT_dhAEKFxTLNX5Q_AqsL7HSl";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

const tournamentId = new URLSearchParams(location.search).get("id");
let allPlayersForPicker = []; // the bracket builder's choices: [{ id, display_name }] — only people who signed up
let bracketSize = null;
let slotAssignments = []; // array of length bracketSize, each entry: { id, name } or null (bye)
let activeSlotIndex = null;
let currentTournament = null;
let currentSignups = [];    // [{ id, player_id, display_name_snapshot, created_at }], in sign-up order

// A tournament goes: "signup" (rules posted, people sign up) → "active" (bracket
// built, matches being played) → "completed". Older tournaments, made before
// sign-ups existed, start straight at "active".
function showScreen(id) {
  ["create-screen", "signup-screen", "builder-screen", "bracket-screen"].forEach(s => {
    document.getElementById(s).style.display = s === id ? "block" : "none";
  });
}

async function init() {
  if (!tournamentId) { showScreen("create-screen"); return; }

  const { data: tournament, error } = await supabaseClient.from("tournaments").select("*").eq("id", tournamentId).maybeSingle();
  if (error || !tournament) {
    showScreen("bracket-screen");
    document.getElementById("tournament-title").textContent = "Tournament not found";
    return;
  }
  currentTournament = tournament;
  if (tournament.status === "signup") {
    showScreen("signup-screen");
    await loadSignupPage();
  } else {
    showScreen("bracket-screen");
    await loadBracket();
  }
}

const isHost = () => {
  const me = window.getBakemonPlayer();
  return !!(me && currentTournament && currentTournament.created_by && me.id === currentTournament.created_by);
};

/* ---------------- Step 1: create (name + rules), sign-ups open ---------------- */

document.getElementById("create-btn").addEventListener("click", createTournament);

async function createTournament() {
  const name = document.getElementById("tournament-name-input").value.trim();
  const info = document.getElementById("tournament-info-input").value.trim();
  const statusEl = document.getElementById("create-status");

  const loggedInPlayer = window.getBakemonPlayer();
  if (!loggedInPlayer) { statusEl.textContent = "Log in first so we know who's running this tournament."; return; }
  if (!name) { statusEl.textContent = "Give the tournament a name."; return; }

  statusEl.textContent = "Opening sign-ups...";
  const { data: tournament, error } = await supabaseClient
    .from("tournaments")
    .insert({ name, info: info || null, status: "signup", created_by: loggedInPlayer.id })
    .select()
    .single();
  if (error) { console.error(error); statusEl.textContent = "Couldn't create the tournament."; return; }

  location.href = `tournament.html?id=${tournament.id}`;
}

/* ---------------- Step 2: the sign-up page ---------------- */

async function loadSignupPage() {
  const t = currentTournament;
  document.getElementById("signup-title").textContent = t.name;
  document.title = `${t.name} · Bakemon Tournament`;

  const [{ data: host }, { data: signups, error }] = await Promise.all([
    t.created_by ? supabaseClient.from("players").select("id, display_name").eq("id", t.created_by).maybeSingle() : Promise.resolve({ data: null }),
    supabaseClient.from("tournament_signups").select("*").eq("tournament_id", t.id).order("created_at")
  ]);
  if (error) console.error(error);
  currentSignups = signups || [];

  document.getElementById("signup-host").innerHTML = host
    ? `Hosted by <a href="player.html?id=${host.id}">${escapeHtml(host.display_name)}</a> · sign-ups are open`
    : "Sign-ups are open";

  renderInfo(document.getElementById("signup-info"), t.info);
  renderSignupAction();
  renderSignupList();
  document.getElementById("host-panel").style.display = isHost() ? "block" : "none";
}

function renderInfo(el, info) {
  el.textContent = info || "The host hasn't posted any rules yet.";
  el.classList.toggle("empty", !info);
}

function renderSignupAction() {
  const el = document.getElementById("signup-action");
  const me = window.getBakemonPlayer();
  if (!me) {
    el.innerHTML = `<div>Want to play? <a href="index.html" style="color:var(--accent);">Log in on the home page</a> to sign up.</div>`;
    return;
  }
  const mine = currentSignups.find(s => s.player_id === me.id);
  el.innerHTML = mine
    ? `<div style="font-weight:700; color:var(--accent); margin-bottom:10px;">You're signed up! ✓</div>
       <button id="withdraw-btn" class="small">Withdraw</button>
       <div class="note">The host will build the bracket when sign-ups close.</div>`
    : `<button id="signup-btn" class="primary">Sign up</button>
       <div class="note">Signing up as ${escapeHtml(me.display_name)}.</div>`;
  document.getElementById("signup-btn")?.addEventListener("click", signUp);
  document.getElementById("withdraw-btn")?.addEventListener("click", () => removeSignup(mine.id));
}

function renderSignupList() {
  const me = window.getBakemonPlayer();
  const host = isHost();
  document.getElementById("signup-count").textContent = `Signed up (${currentSignups.length})`;
  const list = document.getElementById("signup-list");
  if (!currentSignups.length) {
    list.innerHTML = `<div class="info-text empty">Nobody yet. Be the first!</div>`;
    return;
  }
  list.innerHTML = currentSignups.map((s, i) => `
    <div class="signup-row${me && s.player_id === me.id ? ' me' : ''}">
      <span><span class="num">${i + 1}.</span><a href="player.html?id=${s.player_id}">${escapeHtml(s.display_name_snapshot)}</a></span>
      ${host ? `<button class="small" data-remove-signup="${s.id}" title="Remove from this tournament">✕</button>` : ''}
    </div>
  `).join("");
  list.querySelectorAll("[data-remove-signup]").forEach(btn => {
    btn.addEventListener("click", () => {
      const s = currentSignups.find(x => x.id === btn.dataset.removeSignup);
      if (s && confirm(`Remove ${s.display_name_snapshot} from this tournament?`)) removeSignup(s.id);
    });
  });
}

async function signUp() {
  const me = window.getBakemonPlayer();
  if (!me) return;
  const { error } = await supabaseClient.from("tournament_signups")
    .insert({ tournament_id: currentTournament.id, player_id: me.id, display_name_snapshot: me.display_name });
  // A duplicate just means you're already on the list (double-click, two tabs) — nothing to report.
  if (error && error.code !== "23505") { console.error(error); alert("Couldn't sign you up. Try again?"); }
  await loadSignupPage();
}

async function removeSignup(signupId) {
  const { error } = await supabaseClient.from("tournament_signups").delete().eq("id", signupId);
  if (error) { console.error(error); alert("Couldn't remove that sign-up. Try again?"); }
  await loadSignupPage();
}

// Host: edit the rules while sign-ups are open.
document.getElementById("edit-info-btn").addEventListener("click", () => {
  document.getElementById("signup-info-input").value = currentTournament.info || "";
  document.getElementById("signup-info").style.display = "none";
  document.getElementById("signup-info-editor").style.display = "block";
});
document.getElementById("info-cancel-btn").addEventListener("click", () => {
  document.getElementById("signup-info").style.display = "block";
  document.getElementById("signup-info-editor").style.display = "none";
});
document.getElementById("info-save-btn").addEventListener("click", async () => {
  const info = document.getElementById("signup-info-input").value.trim() || null;
  const { error } = await supabaseClient.from("tournaments").update({ info }).eq("id", currentTournament.id);
  if (error) { console.error(error); alert("Couldn't save. Try again?"); return; }
  currentTournament.info = info;
  renderInfo(document.getElementById("signup-info"), info);
  document.getElementById("info-cancel-btn").click();
});

/* ---------------- Step 3: host closes sign-ups and builds the bracket ---------------- */

document.getElementById("close-signups-btn").addEventListener("click", () => {
  if (currentSignups.length < 2) { alert("You need at least 2 people signed up to build a bracket."); return; }
  allPlayersForPicker = currentSignups.map(s => ({ id: s.player_id, display_name: s.display_name_snapshot }));
  document.getElementById("builder-title").textContent = `Build the bracket: ${currentTournament.name}`;
  document.getElementById("builder-hint").textContent =
    `${currentSignups.length} people signed up. Pick a bracket size, then place them, or use "Fill slots in sign-up order".`;
  // Start on the smallest bracket that fits everyone.
  const fits = [4, 8, 16].find(n => n >= currentSignups.length) || 16;
  document.querySelector(`#bracket-size-row [data-size="${fits}"]`).click();
  showScreen("builder-screen");
});
document.getElementById("builder-back-btn").addEventListener("click", () => showScreen("signup-screen"));

function wireBracketSizeButtons() {
  document.querySelectorAll("#bracket-size-row [data-size]").forEach(btn => {
    btn.addEventListener("click", () => {
      bracketSize = parseInt(btn.dataset.size);
      slotAssignments = new Array(bracketSize).fill(null);
      document.querySelectorAll("#bracket-size-row [data-size]").forEach(b => b.classList.toggle("selected", b === btn));
      document.getElementById("fill-order-btn").style.display = "inline-block";
      document.getElementById("builder-status").textContent = "";
      renderSlotGrid();
    });
  });
}
wireBracketSizeButtons();

// One player per match first (slots 1, 3, 5, ...), then the second seat of each
// match. That way every match has someone in it, and any byes are spread out
// instead of piling up at the bottom of the bracket.
document.getElementById("fill-order-btn").addEventListener("click", () => {
  if (!bracketSize) return;
  slotAssignments = new Array(bracketSize).fill(null);
  const order = [];
  for (let i = 0; i < bracketSize; i += 2) order.push(i);
  for (let i = 1; i < bracketSize; i += 2) order.push(i);
  allPlayersForPicker.slice(0, bracketSize).forEach((p, k) => { slotAssignments[order[k]] = { id: p.id, name: p.display_name }; });
  renderSlotGrid();
  const left = allPlayersForPicker.length - bracketSize;
  document.getElementById("builder-status").textContent = left > 0
    ? `${left} ${left === 1 ? "person doesn't" : "people don't"} fit in a ${bracketSize}-player bracket (the last to sign up).`
    : "";
});

function renderSlotGrid() {
  const grid = document.getElementById("slot-grid");
  if (!bracketSize) { grid.innerHTML = ""; return; }
  grid.innerHTML = slotAssignments.map((assignment, i) => `
    <button type="button" class="slot-btn${assignment ? ' filled' : ''}" data-slot-index="${i}">
      <span class="slot-num">#${i + 1}</span>${assignment ? escapeHtml(assignment.name) : 'Empty (bye)'}
    </button>
  `).join("");
  grid.querySelectorAll("[data-slot-index]").forEach(btn => {
    btn.addEventListener("click", () => openSlotPicker(parseInt(btn.dataset.slotIndex)));
  });
}

function openSlotPicker(slotIndex) {
  activeSlotIndex = slotIndex;
  document.getElementById("slot-picker-title").textContent = `Slot #${slotIndex + 1}`;
  const slotOf = (id) => slotAssignments.findIndex(a => a && a.id === id);

  const listEl = document.getElementById("slot-picker-list");
  const emptyBtn = `<button type="button" data-clear="1">— Leave empty (bye) —</button>`;
  // Someone already placed in another slot can still be picked: the two slots trade places,
  // so the host can rearrange matchups without clearing slots first.
  const playerBtns = allPlayersForPicker.map(p => {
    const at = slotOf(p.id);
    const note = at === -1 || at === slotIndex ? "" : ` <span style="opacity:0.6;">(in slot #${at + 1}, swap)</span>`;
    return `<button type="button" data-player-id="${p.id}">${escapeHtml(p.display_name)}${note}</button>`;
  }).join("");
  listEl.innerHTML = emptyBtn + playerBtns;

  listEl.querySelector("[data-clear]").addEventListener("click", () => {
    slotAssignments[activeSlotIndex] = null;
    closeSlotPicker();
    renderSlotGrid();
  });
  listEl.querySelectorAll("[data-player-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      const player = allPlayersForPicker.find(p => p.id === btn.dataset.playerId);
      const from = slotOf(player.id);
      if (from !== -1 && from !== activeSlotIndex) slotAssignments[from] = slotAssignments[activeSlotIndex];   // whoever was here moves to their old slot (or it becomes a bye)
      slotAssignments[activeSlotIndex] = { id: player.id, name: player.display_name };
      closeSlotPicker();
      renderSlotGrid();
    });
  });

  document.getElementById("slot-picker-backdrop").classList.add("open");
}

function closeSlotPicker() {
  document.getElementById("slot-picker-backdrop").classList.remove("open");
  activeSlotIndex = null;
}
document.getElementById("slot-picker-close").addEventListener("click", closeSlotPicker);
document.getElementById("slot-picker-backdrop").addEventListener("click", (e) => {
  if (e.target.id === "slot-picker-backdrop") closeSlotPicker();
});

document.getElementById("build-btn").addEventListener("click", buildBracket);

async function buildBracket() {
  const statusEl = document.getElementById("builder-status");

  if (!isHost()) { statusEl.textContent = "Only the host can start the tournament."; return; }
  if (!bracketSize) { statusEl.textContent = "Pick a bracket size."; return; }

  const filledSlots = slotAssignments.filter(a => a);
  if (filledSlots.length < 2) { statusEl.textContent = "Assign at least 2 players to slots."; return; }
  // Exactly one real player and one empty slot in the SAME match is a valid
  // bye; two real players in the same match is normal; what's never valid
  // is a lone real player with no opponent anywhere near them in a bracket
  // that otherwise has room — that's just an unfilled slot, not a bye, and
  // would silently make that match un-playable. Simplest safe rule for a
  // manual bracket: every match (pair of adjacent slots) must have at
  // least one real player. Check that here rather than let it surface as
  // a confusing "TBD vs TBD" match later.
  for (let m = 0; m < bracketSize / 2; m++) {
    if (!slotAssignments[m * 2] && !slotAssignments[m * 2 + 1]) {
      statusEl.textContent = `Match #${m + 1} (slots ${m * 2 + 1} & ${m * 2 + 2}) has no players in it — assign at least one.`;
      return;
    }
  }

  statusEl.textContent = "Building the bracket...";
  const tournament = currentTournament;
  // A double-click must not build the bracket twice.
  const buildBtn = document.getElementById("build-btn");
  if (buildBtn.disabled) return;
  buildBtn.disabled = true;
  const fail = (msg, err) => { console.error(err); statusEl.textContent = msg; buildBtn.disabled = false; };

  const playerRows = filledSlots.map((assignment, i) => ({
    tournament_id: tournament.id,
    player_id: assignment.id,
    display_name_snapshot: assignment.name,
    seed_position: i + 1
  }));
  const { error: pErr } = await supabaseClient.from("tournament_players").insert(playerRows);
  if (pErr) return fail("Couldn't save the player list.", pErr);

  const matchRows = buildBracketMatches(tournament.id, slotAssignments, bracketSize);
  const { error: mErr } = await supabaseClient.from("tournament_matches").insert(matchRows);
  if (mErr) return fail("Couldn't generate the bracket.", mErr);

  // Byes are decided immediately (their winner_id is set at creation), but
  // nothing has pushed that winner into the next round yet — the normal
  // advancement path only runs when a match is clicked, and a bye is never
  // clicked. Forward every bye's winner now, exactly as declareWinner()
  // would if a person had clicked it.
  const byeRows = matchRows.filter(r => r.winner_id && r.advances_to_match_position);
  for (const bye of byeRows) {
    const field = bye.advances_to_slot === 1
      ? { player_1_id: bye.winner_id, player_1_name_snapshot: bye.winner_name_snapshot }
      : { player_2_id: bye.winner_id, player_2_name_snapshot: bye.winner_name_snapshot };
    const { error: advanceErr } = await supabaseClient
      .from("tournament_matches")
      .update(field)
      .eq("tournament_id", tournament.id)
      .eq("round", bye.round + 1)
      .eq("match_position", bye.advances_to_match_position);
    if (advanceErr) console.error("Failed to advance a bye winner:", advanceErr);
  }

  // Sign-ups are closed: from here on it's the normal bracket.
  const { error: sErr } = await supabaseClient.from("tournaments").update({ status: "active" }).eq("id", tournament.id);
  if (sErr) { console.error(sErr); statusEl.textContent = "The bracket was made, but the tournament couldn't be marked as started. Refresh and try again."; return; }

  location.href = `tournament.html?id=${tournament.id}`;
}

// Builds every match row for every round up front. Round 1 comes DIRECTLY
// from the human-assigned slots — no algorithmic pairing, no bye-spreading
// math. A round-1 match with exactly one real player is an immediate bye
// (that real player is the winner, no game played).
//
// Every round AFTER round 1 is always built fully empty (TBD vs TBD),
// full stop — never auto-decided, even if one side happens to already be
// known (e.g. a bye winner). This matters because "empty" means two
// different things depending on the round: in round 1, an empty slot
// means nobody was ever placed there (a real bye). In round 2+, an empty
// slot ALWAYS means "outcome not decided yet" — even if the OTHER slot in
// that same match already has a name in it. Treating those the same
// (checked here as "exactly one side present = bye") was the bug: it let
// a bye winner's arrival into round 2 get mistaken for winning round 2
// itself, before their actual opponent had even been determined.
function buildBracketMatches(tournamentId, seeds, size) {
  const rows = [];
  let round = 1;
  let currentRoundSize = size;

  // Round 1 only: resolve real byes from the human-placed seeds.
  const round1WinnersAdvancing = [];
  for (let m = 0; m < currentRoundSize / 2; m++) {
    const p1 = seeds[m * 2];
    const p2 = seeds[m * 2 + 1];
    const isBye = (p1 && !p2) || (!p1 && p2);
    const byeWinner = p1 || p2 || null;

    const matchesThisRound = currentRoundSize / 2;
    const nextRoundMatchPosition = Math.floor(m / 2) + 1;
    const nextRoundSlot = (m % 2) + 1;
    const hasNextRound = matchesThisRound > 1;

    rows.push({
      tournament_id: tournamentId,
      round: 1,
      match_position: m + 1,
      player_1_id: p1 ? p1.id : null,
      player_1_name_snapshot: p1 ? p1.name : null,
      player_2_id: p2 ? p2.id : null,
      player_2_name_snapshot: p2 ? p2.name : null,
      winner_id: isBye ? byeWinner.id : null,
      winner_name_snapshot: isBye ? byeWinner.name : null,
      advances_to_match_position: hasNextRound ? nextRoundMatchPosition : null,
      advances_to_slot: hasNextRound ? nextRoundSlot : null
    });

    round1WinnersAdvancing.push(isBye ? byeWinner : null); // tracked only so we know a bye winner exists to forward later — NOT reused to decide round 2's shape
  }

  // Every round after round 1: always fully empty, no auto-deciding,
  // regardless of whether a bye winner is already known for one slot.
  currentRoundSize = currentRoundSize / 2;
  round = 2;
  while (currentRoundSize >= 1) {
    const matchesThisRound = currentRoundSize / 2;
    if (matchesThisRound < 1) break;
    for (let m = 0; m < matchesThisRound; m++) {
      const nextRoundMatchPosition = Math.floor(m / 2) + 1;
      const nextRoundSlot = (m % 2) + 1;
      const hasNextRound = matchesThisRound > 1;
      rows.push({
        tournament_id: tournamentId,
        round,
        match_position: m + 1,
        player_1_id: null,
        player_1_name_snapshot: null,
        player_2_id: null,
        player_2_name_snapshot: null,
        winner_id: null,
        winner_name_snapshot: null,
        advances_to_match_position: hasNextRound ? nextRoundMatchPosition : null,
        advances_to_slot: hasNextRound ? nextRoundSlot : null
      });
    }
    currentRoundSize = matchesThisRound;
    round += 1;
  }

  return rows;
}

async function loadBracket() {
  const [{ data: tournament, error: tErr }, { data: matches, error: mErr }] = await Promise.all([
    supabaseClient.from("tournaments").select("*").eq("id", tournamentId).maybeSingle(),
    supabaseClient.from("tournament_matches").select("*").eq("tournament_id", tournamentId).order("round").order("match_position")
  ]);

  if (tErr || !tournament) {
    document.getElementById("tournament-title").textContent = "Tournament not found";
    return;
  }
  if (mErr) {
    console.error(mErr);
    return;
  }

  document.getElementById("tournament-title").textContent = tournament.name;
  document.title = `${tournament.name} · Bakemon Tournament`;
  const infoBox = document.getElementById("bracket-info");
  if (tournament.info) {
    document.getElementById("bracket-info-text").textContent = tournament.info;
    infoBox.style.display = "block";
    infoBox.open = tournament.status !== "completed";   // open while it's being played, tucked away once it's over
  } else {
    infoBox.style.display = "none";
  }

  const loggedInPlayer = window.getBakemonPlayer();
  const isOwner = !!(loggedInPlayer && tournament.created_by && loggedInPlayer.id === tournament.created_by);

  const rounds = {};
  (matches || []).forEach(m => {
    if (!rounds[m.round]) rounds[m.round] = [];
    rounds[m.round].push(m);
  });
  const roundNumbers = Object.keys(rounds).map(Number).sort((a, b) => a - b);
  const finalRound = roundNumbers[roundNumbers.length - 1];
  const finalMatch = rounds[finalRound] && rounds[finalRound][0];
  const champion = finalMatch && finalMatch.winner_name_snapshot;
  const championId = finalMatch && finalMatch.winner_id;

  document.getElementById("subheading").textContent = champion
    ? "This tournament has concluded."
    : isOwner
      ? "Click a name to declare the winner of that match."
      : "Only this tournament's creator can declare winners.";

  const banner = document.getElementById("champion-banner");
  if (champion) {
    banner.style.display = "block";
    const championNameEl = document.getElementById("champion-name");
    championNameEl.innerHTML = championId
      ? `<a href="player.html?id=${championId}" style="color:inherit; text-decoration:none;">${escapeHtml(champion)}</a>`
      : escapeHtml(champion);
  } else {
    banner.style.display = "none";
  }

  const roundLabel = (roundNum) => {
    const totalRounds = roundNumbers.length;
    const fromEnd = totalRounds - roundNum;
    if (fromEnd === 0) return "Final";
    if (fromEnd === 1) return "Semifinal";
    if (fromEnd === 2) return "Quarterfinal";
    return `Round ${roundNum}`;
  };

  document.getElementById("bracket").innerHTML = roundNumbers.map(roundNum => `
    <div class="round-col">
      <div class="round-title">${roundLabel(roundNum)}</div>
      ${rounds[roundNum].map(m => matchBoxHtml(m, isOwner)).join("")}
    </div>
  `).join("");

  attachMatchHandlers();
}

function matchBoxHtml(m, isOwner) {
  const decided = !!m.winner_id || !!m.winner_name_snapshot;
  const slotHtml = (name, isWinnerSlot, playerId, otherFilled) => {
    if (!name) {
      // A decided match with an empty slot is a genuine bye (nobody was
      // ever there) — label it plainly rather than "Waiting...", which
      // would wrongly imply someone is still expected to show up.
      const label = decided ? 'Bye' : (otherFilled ? 'Waiting...' : 'TBD');
      return `<div class="match-slot empty">${label}</div>`;
    }
    const classes = ["match-slot"];
    if (isWinnerSlot) classes.push("winner");
    if (decided) classes.push("decided");
    // Only clickable if this match has both slots filled, isn't decided yet,
    // and the viewer is this tournament's creator.
    const clickable = isOwner && m.player_1_name_snapshot && m.player_2_name_snapshot && !decided;
    return `<div class="${classes.join(' ')}" ${clickable ? `data-declare-winner data-match-id="${m.id}" data-winner-name="${escapeHtml(name)}" data-winner-player-id="${playerId || ''}"` : ''}>
      <span>${escapeHtml(name)}</span>
    </div>`;
  };

  const p1Winner = decided && m.winner_name_snapshot === m.player_1_name_snapshot;
  const p2Winner = decided && m.winner_name_snapshot === m.player_2_name_snapshot;

  return `
    <div class="match-box">
      ${slotHtml(m.player_1_name_snapshot, p1Winner, m.player_1_id, !!m.player_2_name_snapshot)}
      ${slotHtml(m.player_2_name_snapshot, p2Winner, m.player_2_id, !!m.player_1_name_snapshot)}
    </div>
  `;
}

function attachMatchHandlers() {
  document.querySelectorAll("[data-declare-winner]").forEach(el => {
    el.addEventListener("click", () => declareWinner(el.dataset.matchId, el.dataset.winnerPlayerId || null, el.dataset.winnerName));
  });
}

async function declareWinner(matchId, winnerPlayerId, winnerName) {
  const { data: match, error: fetchErr } = await supabaseClient
    .from("tournament_matches")
    .select("*")
    .eq("id", matchId)
    .maybeSingle();
  if (fetchErr || !match) { console.error(fetchErr); return; }

  const { error: updateErr } = await supabaseClient
    .from("tournament_matches")
    .update({ winner_id: winnerPlayerId, winner_name_snapshot: winnerName })
    .eq("id", matchId);
  if (updateErr) { console.error(updateErr); alert("Couldn't record that result. Try again?"); return; }

  // Advance the winner into the next round's match/slot, if there is one.
  if (match.advances_to_match_position) {
    const { data: nextMatch, error: nextErr } = await supabaseClient
      .from("tournament_matches")
      .select("*")
      .eq("tournament_id", match.tournament_id)
      .eq("round", match.round + 1)
      .eq("match_position", match.advances_to_match_position)
      .maybeSingle();
    if (nextErr || !nextMatch) { console.error(nextErr); }
    else {
      const field = match.advances_to_slot === 1
        ? { player_1_id: winnerPlayerId, player_1_name_snapshot: winnerName }
        : { player_2_id: winnerPlayerId, player_2_name_snapshot: winnerName };
      const { error: advanceErr } = await supabaseClient
        .from("tournament_matches")
        .update(field)
        .eq("id", nextMatch.id);
      if (advanceErr) console.error(advanceErr);
    }
  } else {
    // No next match — this WAS the final. Mark the tournament completed.
    await supabaseClient.from("tournaments").update({ status: "completed", completed_at: new Date().toISOString() }).eq("id", match.tournament_id);
  }

  await loadBracket();
}

init();
</script>
